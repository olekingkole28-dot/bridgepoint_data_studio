name: bridgepoint_data_studio
description: BridgePoint Intelligence live property opportunity platform.
publish_to: none
version: 0.90.0+90

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  geolocator: ^14.0.2
  http: ^1.5.0
  latlong2: ^0.9.1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.10.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/bridgepoint-intelligence-background-v1.webp
    - assets/images/bridgepoint-daily-brief-background-v2.webp
    - assets/images/bridgepoint-map-background-v2.webp
