<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#020711" />
  <title>BridgePoint World</title>
  <link rel="preconnect" href="https://cesium.com" />
  <link rel="preconnect" href="https://tile.googleapis.com" />
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
  <script>window.BRIDGEPOINT_WORLD_CONFIG=window.BRIDGEPOINT_WORLD_CONFIG||{};</script>
  <script src="./runtime-config.local.js"></script>
  <link rel="stylesheet" href="./world-v2400.css" />
</head>
<body>
  <div id="cesiumContainer" aria-label="BridgePoint interactive 3D world"></div>
  <div id="weatherFx" aria-hidden="true"></div>

  <header id="hud">
    <div id="brand" class="panel">
      <div class="mark" aria-hidden="true"></div>
      <div><b>BRIDGEPOINT WORLD</b><small>U.S. property truth • global expansion surface</small></div>
    </div>
    <nav id="controls" class="panel" aria-label="World controls">
      <button id="locate" class="primary" type="button">◎ <span>My location</span></button>
      <button id="us" type="button">◉ <span>U.S.</span></button>
      <button id="photoreal" class="gold" type="button">▦ <span>Photoreal</span></button>
      <button id="walk" class="gold" type="button">↟ <span>Walk view</span></button>
      <button id="hazards" type="button">◌ <span>Live alerts</span></button>
      <button id="reload" type="button">↻ <span>Reload block</span></button>
      <button id="back" type="button">← <span>BridgePoint</span></button>
    </nav>
  </header>

  <aside id="legend" class="panel" aria-label="Map legend">
    <span><i class="dot cyan"></i>source-backed</span>
    <span><i class="dot goldDot"></i>estimated height</span>
    <span><i class="line opportunity"></i>high opportunity</span>
    <span><i class="line locked"></i>locked country</span>
  </aside>

  <section id="lockCard" class="panel" hidden aria-live="polite">
    <div class="lockHead"><div><b id="lockTitle">Locked — Under Construction</b><small id="lockDetail"></small></div><button id="lockClose" type="button" aria-label="Close">×</button></div>
    <button id="requestBuild" class="gold wide" type="button">Request Build</button>
    <div id="lockStatus" class="muted"></div>
  </section>

  <div id="status" class="panel" aria-live="polite">Starting BridgePoint World…</div>
  <aside id="drawer" class="panel" aria-live="polite"></aside>
  <div id="voiceBox" class="panel">
    <input id="voiceText" autocomplete="off" placeholder="Ask BridgePoint about a property or place…" aria-label="Ask BridgePoint" />
    <button id="mic" class="primary" type="button" aria-label="Voice search">🎙</button>
    <button id="ask" type="button">Ask</button>
  </div>

  <!-- Release contract marker: bridgepoint_3d_world_viewport_v1899 is implemented in ./world-v2400.js -->
  <script type="module" src="./world-v2400.js"></script>
</body>
</html>
