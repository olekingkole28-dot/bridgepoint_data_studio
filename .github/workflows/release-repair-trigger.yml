name: BridgePoint controlled release repair

on:
  pull_request:
    paths:
      - '.github/release-repair-trigger.txt'

permissions:
  contents: write

jobs:
  repair-release-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair stale release marker
        run: python .github/scripts/repair_release_pipeline.py
      - name: Commit repair when changed
        run: |
          if git diff --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git config user.name "BridgePoint Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tool/apply_property_media_everywhere_v174.py
          git commit -m "Make property media release layer responsive-safe"
          git push origin HEAD:main
