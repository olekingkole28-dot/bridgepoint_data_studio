name: Apply National Live Demo V690

on:
  push:
    branches: [main]
    paths:
      - tool/apply_national_live_demo_v690.py
      - .github/workflows/apply-national-live-demo-v690.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-apply-national-live-demo-v690
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply V690 to canonical Flutter source
        run: |
          set -euo pipefail
          python tool/apply_national_live_demo_v690.py
          grep -q 'bridgepoint-v690-national-live-demo' lib/main.dart
          grep -q 'bridgepoint_property_suggestions_v192' lib/main.dart
          grep -q 'Open full property intelligence' lib/main.dart
          grep -q 'Show U.S. intelligence' lib/main.dart
      - name: Persist canonical source fix
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo 'V690 source already current.'
          else
            git commit -m 'Enable national live property demo V690 [skip ci]'
            git push origin HEAD:main
          fi
