# productized release trigger v2
name: BridgePoint Productized V2 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/productized-v2-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-productized-v2-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify product UI source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/main_v2.dart
          test -s lib/v2/bridgepoint_property_dossier_v2.dart
          test -s lib/v2/bridgepoint_building_geometry_v2.dart
          grep -q "BridgePointPropertyDossierV2" lib/v2/bridgepoint_properties_v2.dart
          grep -q "BridgePointPropertyDossierV2" lib/v2/bridgepoint_investor_v2.dart
          grep -q "asPage: true" lib/v2/bridgepoint_properties_v2.dart
          grep -q "asPage: true" lib/v2/bridgepoint_investor_v2.dart
          grep -q "VISUAL INTELLIGENCE" lib/v2/bridgepoint_property_dossier_v2.dart
          grep -q "bridgepoint_property_imagery_history_v169" lib/v2/bridgepoint_property_dossier_v2.dart
          grep -q "bridgepoint_property_photo_contributions_v266" lib/v2/bridgepoint_property_dossier_v2.dart
          grep -q "BridgePointBuildingGeometryV2" lib/v2/bridgepoint_property_dossier_v2.dart
          grep -q "This workspace section is still building" lib/v2/bridgepoint_operations_workspace_v2.dart
          if grep -q "for (final entry in row.entries)" lib/v2/bridgepoint_investor_v2.dart; then
            echo 'Raw Investor payload dump still reachable' >&2
            exit 1
          fi
          echo 'Full-screen property dossier and productized Operations contract verified.'

      - name: Bundle Space Grotesk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl -fsSL --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf' -o assets/fonts/SpaceGrotesk.ttf
          curl -fsSL --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/OFL.txt' -o assets/fonts/OFL-SpaceGrotesk.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text()
          if 'family: BridgePointGrotesk' not in s:
              s += "\n  fonts:\n    - family: BridgePointGrotesk\n      fonts:\n        - asset: assets/fonts/SpaceGrotesk.ttf\n"
          p.write_text(s)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Analyze productized V2
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test

      - name: Build productized web app
        shell: bash
        run: |
          set -euo pipefail
          cat > web/bridgepoint-v2-release.json <<EOF
          {"architecture":"clean-v2","version":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","backend":"existing-production-supabase","production_candidate":true,"restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true,"visual_polish_v2":true,"brand_font":"SpaceGrotesk","property_dossier_v2":true,"property_visuals_v2":true,"operations_product_ui_v2":true,"fullscreen_property_dossier_v2":true}
          EOF
          flutter build web --release -t lib/main_v2.dart --base-href "/app/" --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
          grep -q '<base href="/app/">' build/web/index.html
          test -s build/web/assets/fonts/MaterialIcons-Regular.otf
          SPACE_FONT="$(find build/web/assets -type f -name 'SpaceGrotesk.ttf' -print -quit)"
          test -n "$SPACE_FONT"
          test -s "$SPACE_FONT"
          grep -q 'BridgePointGrotesk' build/web/assets/FontManifest.json
          cp assets/fonts/OFL-SpaceGrotesk.txt "$(dirname "$SPACE_FONT")/OFL-SpaceGrotesk.txt"
          MAIN_SHA="$(sha256sum build/web/main.dart.js | awk '{print $1}')"
          ICON_SHA="$(sha256sum build/web/assets/fonts/MaterialIcons-Regular.otf | awk '{print $1}')"
          SPACE_SHA="$(sha256sum "$SPACE_FONT" | awk '{print $1}')"
          cat > build/web/bridgepoint-release.json <<EOF
          {"version":"${GITHUB_SHA}","architecture":"clean-v2","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true,"visual_polish_v2":true,"brand_font":"SpaceGrotesk","property_dossier_v2":true,"property_visuals_v2":true,"operations_product_ui_v2":true,"fullscreen_property_dossier_v2":true,"material_icon_font_sha256":"${ICON_SHA}","space_grotesk_sha256":"${SPACE_SHA}"}
          EOF
          cat > build/web/public-promotion-v682.json <<EOF
          {"public_release":"clean-v2","compiled_source_sha":"${GITHUB_SHA}","private_build_run":${GITHUB_RUN_ID},"main_js_sha256":"${MAIN_SHA}","material_icon_font_sha256":"${ICON_SHA}","space_grotesk_sha256":"${SPACE_SHA}","source_repo_private":true,"architecture":"clean-v2","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true,"visual_polish_v2":true,"brand_font":"SpaceGrotesk","property_dossier_v2":true,"property_visuals_v2":true,"operations_product_ui_v2":true,"fullscreen_property_dossier_v2":true}
          EOF
          touch build/web/.nojekyll

      - name: Build exact handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-delta /tmp/v2-handoff
          mkdir -p /tmp/v2-delta /tmp/v2-handoff
          for f in index.html main.dart.js flutter.js flutter_bootstrap.js flutter_service_worker.js manifest.json version.json favicon.png acquisition_tracker.js bridgepoint-v2-release.json bridgepoint-release.json public-promotion-v682.json .nojekyll; do
            if [ -e "build/web/$f" ]; then cp -a "build/web/$f" /tmp/v2-delta/; fi
          done
          mkdir -p /tmp/v2-delta/assets/assets/brand
          cp build/web/assets/assets/brand/bridgepoint-mark-v80.svg /tmp/v2-delta/assets/assets/brand/
          mkdir -p /tmp/v2-delta/assets/fonts
          cp -a build/web/assets/fonts/. /tmp/v2-delta/assets/fonts/
          if [ -d build/web/assets/assets/fonts ]; then
            mkdir -p /tmp/v2-delta/assets/assets/fonts
            cp -a build/web/assets/assets/fonts/. /tmp/v2-delta/assets/assets/fonts/
          fi
          for f in AssetManifest.bin AssetManifest.bin.json FontManifest.json NOTICES.Z; do
            if [ -e "build/web/assets/$f" ]; then cp -a "build/web/assets/$f" /tmp/v2-delta/assets/; fi
          done
          tar -C /tmp/v2-delta -czf /tmp/v2-delta.tar.gz .
          base64 -w0 /tmp/v2-delta.tar.gz > /tmp/v2-delta.tar.gz.b64
          split -b 400000 -d -a 3 /tmp/v2-delta.tar.gz.b64 /tmp/v2-handoff/chunk-
          SHA256="$(sha256sum /tmp/v2-delta.tar.gz | awk '{print $1}')"
          BYTES="$(stat -c '%s' /tmp/v2-delta.tar.gz)"
          CHUNKS="$(find /tmp/v2-handoff -type f -name 'chunk-*' | wc -l)"
          ICON_SHA="$(sha256sum /tmp/v2-delta/assets/fonts/MaterialIcons-Regular.otf | awk '{print $1}')"
          SPACE_FONT="$(find /tmp/v2-delta/assets -type f -name 'SpaceGrotesk.ttf' -print -quit)"
          SPACE_SHA="$(sha256sum "$SPACE_FONT" | awk '{print $1}')"
          cat > /tmp/v2-handoff/manifest.json <<EOF
          {"architecture":"clean-v2","source_sha":"${GITHUB_SHA}","source_run":${GITHUB_RUN_ID},"archive_sha256":"${SHA256}","archive_bytes":${BYTES},"chunk_count":${CHUNKS},"chunk_encoding":"base64","chunk_size":400000,"target":"bridgepoint-live/live-artifact/app","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"visual_polish_v2":true,"property_dossier_v2":true,"property_visuals_v2":true,"operations_product_ui_v2":true,"fullscreen_property_dossier_v2":true,"brand_font":"SpaceGrotesk","material_icon_font_included":true,"material_icon_font_sha256":"${ICON_SHA}","space_grotesk_included":true,"space_grotesk_sha256":"${SPACE_SHA}"}
          EOF

      - name: Publish handoff branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v2-handoff
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b clean-v2-handoff
          git add -A
          git commit -m "Productized V2 handoff ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin clean-v2-handoff
