# BridgePoint visual release gate v1
name: BridgePoint Visual V2 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-release-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-visual-v2-release
  cancel-in-progress: true

jobs:
  build-visual-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify visual source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/main_v2.dart
          test -s lib/v2/bridgepoint_app_v2.dart
          test -s lib/v2/bridgepoint_home_live_v2.dart
          test -s lib/v2/bridgepoint_map_weather_v2.dart
          test -s lib/v2/bridgepoint_properties_v2.dart
          test -s lib/v2/bridgepoint_opportunities_v2.dart
          test -s lib/v2/bridgepoint_buildings_v2.dart
          test -s lib/screens/bridgepoint_owner_overview_v2.dart
          grep -q "BridgePointGrotesk" lib/v2/bridgepoint_app_v2.dart
          grep -q "fontSize: 46" lib/v2/bridgepoint_app_v2.dart
          grep -q "Color(0xFF48E1FF)" lib/v2/bridgepoint_app_v2.dart
          grep -q "WHY IT RANKED" lib/v2/bridgepoint_home_live_v2.dart
          grep -q "bridgepoint_flutter_intelligence_map_national_v346" lib/v2/bridgepoint_map_weather_v2.dart
          grep -q "BridgePointPropertiesV2" lib/v2/bridgepoint_properties_v2.dart
          echo 'Visual hierarchy and restored product surface contract verified.'

      - name: Prepare bundled Space Grotesk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl -fsSL --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf' -o assets/fonts/SpaceGrotesk.ttf
          curl -fsSL --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/OFL.txt' -o assets/fonts/OFL-SpaceGrotesk.txt
          test -s assets/fonts/SpaceGrotesk.ttf
          test -s assets/fonts/OFL-SpaceGrotesk.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text(encoding='utf-8')
          if 'family: BridgePointGrotesk' not in s:
              s += "\n  fonts:\n    - family: BridgePointGrotesk\n      fonts:\n        - asset: assets/fonts/SpaceGrotesk.ttf\n"
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'family: BridgePointGrotesk' pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze polished V2
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run release tests
        run: flutter test

      - name: Stamp and build polished /app
        shell: bash
        run: |
          set -euo pipefail
          cat > web/bridgepoint-v2-release.json <<EOF
          {"architecture":"clean-v2","version":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","backend":"existing-production-supabase","production_candidate":true,"restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true,"visual_polish_v2":true,"brand_font":"SpaceGrotesk"}
          EOF
          flutter build web --release -t lib/main_v2.dart --base-href "/app/" --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
          grep -q '<base href="/app/">' build/web/index.html
          grep -q 'Install BridgePoint' build/web/index.html
          test -s build/web/assets/fonts/MaterialIcons-Regular.otf
          SPACE_FONT="$(find build/web/assets -type f -name 'SpaceGrotesk.ttf' -print -quit)"
          test -n "$SPACE_FONT"
          test -s "$SPACE_FONT"
          grep -q 'BridgePointGrotesk' build/web/assets/FontManifest.json
          cp assets/fonts/OFL-SpaceGrotesk.txt "$(dirname "$SPACE_FONT")/OFL-SpaceGrotesk.txt"
          MAIN_SHA="$(sha256sum build/web/main.dart.js | awk '{print $1}')"
          ICON_SHA="$(sha256sum build/web/assets/fonts/MaterialIcons-Regular.otf | awk '{print $1}')"
          SPACE_SHA="$(sha256sum "$SPACE_FONT" | awk '{print $1}')"
          cat > build/web/bridgepoint-release.json <<EOF
          {"version":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","public_origin":"https://bridgepointintelligence.online/","architecture":"clean-v2","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true,"visual_polish_v2":true,"brand_font":"SpaceGrotesk","material_icon_font_sha256":"${ICON_SHA}","space_grotesk_sha256":"${SPACE_SHA}"}
          EOF
          cat > build/web/public-promotion-v682.json <<EOF
          {"public_release":"clean-v2","compiled_source_sha":"${GITHUB_SHA}","private_build_run":${GITHUB_RUN_ID},"main_js_sha256":"${MAIN_SHA}","material_icon_font_sha256":"${ICON_SHA}","space_grotesk_sha256":"${SPACE_SHA}","source_repo_private":true,"architecture":"clean-v2","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true,"visual_polish_v2":true,"brand_font":"SpaceGrotesk"}
          EOF
          touch build/web/.nojekyll

      - name: Build visual handoff chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-delta /tmp/v2-handoff
          mkdir -p /tmp/v2-delta /tmp/v2-handoff
          for f in index.html main.dart.js flutter.js flutter_bootstrap.js flutter_service_worker.js manifest.json version.json favicon.png acquisition_tracker.js bridgepoint-v2-release.json bridgepoint-release.json public-promotion-v682.json .nojekyll; do
            if [ -e "build/web/$f" ]; then cp -a "build/web/$f" /tmp/v2-delta/; fi
          done
          mkdir -p /tmp/v2-delta/assets/assets/brand
          cp build/web/assets/assets/brand/bridgepoint-mark-v80.svg /tmp/v2-delta/assets/assets/brand/
          mkdir -p /tmp/v2-delta/assets/fonts
          cp -a build/web/assets/fonts/. /tmp/v2-delta/assets/fonts/
          if [ -d build/web/assets/assets/fonts ]; then
            mkdir -p /tmp/v2-delta/assets/assets/fonts
            cp -a build/web/assets/assets/fonts/. /tmp/v2-delta/assets/assets/fonts/
          fi
          for f in AssetManifest.bin AssetManifest.bin.json FontManifest.json NOTICES.Z; do
            if [ -e "build/web/assets/$f" ]; then cp -a "build/web/assets/$f" /tmp/v2-delta/assets/; fi
          done
          test -s /tmp/v2-delta/assets/fonts/MaterialIcons-Regular.otf
          SPACE_FONT="$(find /tmp/v2-delta/assets -type f -name 'SpaceGrotesk.ttf' -print -quit)"
          test -n "$SPACE_FONT"
          test -s "$SPACE_FONT"
          tar -C /tmp/v2-delta -czf /tmp/v2-delta.tar.gz .
          base64 -w0 /tmp/v2-delta.tar.gz > /tmp/v2-delta.tar.gz.b64
          split -b 400000 -d -a 3 /tmp/v2-delta.tar.gz.b64 /tmp/v2-handoff/chunk-
          SHA256="$(sha256sum /tmp/v2-delta.tar.gz | awk '{print $1}')"
          BYTES="$(stat -c '%s' /tmp/v2-delta.tar.gz)"
          CHUNKS="$(find /tmp/v2-handoff -type f -name 'chunk-*' | wc -l)"
          ICON_SHA="$(sha256sum /tmp/v2-delta/assets/fonts/MaterialIcons-Regular.otf | awk '{print $1}')"
          SPACE_SHA="$(sha256sum "$SPACE_FONT" | awk '{print $1}')"
          cat > /tmp/v2-handoff/manifest.json <<EOF
          {"architecture":"clean-v2","source_sha":"${GITHUB_SHA}","source_run":${GITHUB_RUN_ID},"archive_sha256":"${SHA256}","archive_bytes":${BYTES},"chunk_count":${CHUNKS},"chunk_encoding":"base64","chunk_size":400000,"target":"bridgepoint-live/live-artifact/app","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"visual_polish_v2":true,"brand_font":"SpaceGrotesk","material_icon_font_included":true,"material_icon_font_sha256":"${ICON_SHA}","space_grotesk_included":true,"space_grotesk_sha256":"${SPACE_SHA}"}
          EOF
          cat /tmp/v2-handoff/manifest.json

      - name: Publish private visual handoff branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v2-handoff
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b clean-v2-handoff
          git add -A
          git commit -m "Clean V2 visual compiled handoff ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin clean-v2-handoff
