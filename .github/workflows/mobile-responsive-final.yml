name: BridgePoint final phone layout patch

on:
  push:
    paths:
      - '.github/workflows/mobile-responsive-final.yml'

permissions:
  contents: write

jobs:
  finalize-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final phone-first layouts
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/main.dart')
          src = path.read_text()

          old_keys = """  static const packageModelKeys = <String, String>{
    'All Intelligence': 'all',
    'BridgePoint Homeowner': 'bridgepoint_home',
    'BridgePoint Home': 'bridgepoint_home',
    'BridgePoint Commercial': 'bridgepoint_commercial',
    'Roofing Opportunity': 'roofing_opportunity',
    'BridgePoint General': 'bridgepoint_general_v1',
    'Property Investor': 'property_investor',
    'Development Opportunity': 'development_opportunity',
    'Solar Opportunity': 'solar_opportunity',
  };"""
          new_keys = """  static const packageModelKeys = <String, String>{
    'Owner Full Platform': 'all',
    'BridgePoint Homeowner': 'bridgepoint_home',
    'BridgePoint Home': 'bridgepoint_home',
    'BridgePoint Commercial': 'bridgepoint_commercial',
    'Roofing Opportunity': 'roofing_opportunity',
    'BridgePoint General': 'bridgepoint_general_v1',
    'Property Investor': 'property_investor',
    'Development Opportunity': 'development_opportunity',
    'Solar Opportunity': 'solar_opportunity',
  };"""
          if old_keys not in src:
              raise SystemExit('Package key target not found')
          src = src.replace(old_keys, new_keys, 1)

          old_packages = """  static const packages = <String>[
    'All Intelligence',
    'BridgePoint Homeowner',
    'BridgePoint Home',
    'BridgePoint Commercial',
    'Roofing Opportunity',
    'BridgePoint General',
    'Property Investor',
    'Development Opportunity',
    'Solar Opportunity',
  ];"""
          new_packages = """  static const customerPackages = <String>[
    'BridgePoint Homeowner',
    'BridgePoint Home',
    'BridgePoint Commercial',
    'Roofing Opportunity',
    'BridgePoint General',
    'Property Investor',
    'Development Opportunity',
    'Solar Opportunity',
  ];

  List<String> get packages => <String>[
    if (widget.ownerMode) 'Owner Full Platform',
    ...customerPackages,
  ];"""
          if old_packages not in src:
              raise SystemExit('Package list target not found')
          src = src.replace(old_packages, new_packages, 1)
          src = src.replace("if(widget.ownerMode)selectedPackage='All Intelligence';", "if(widget.ownerMode)selectedPackage='Owner Full Platform';", 1)

          start = src.index('class _OpportunityListCard extends StatelessWidget {')
          end = src.index('class _OpportunityChip extends StatelessWidget {', start)
          card = r'''class _OpportunityListCard extends StatelessWidget {
            const _OpportunityListCard({required this.opportunity});

            final Map<String, dynamic> opportunity;

            @override
            Widget build(BuildContext context) {
              final score = opportunity['score'] as num?;
              final confidence = opportunity['confidence_score'] as num? ??
                  opportunity['opportunity_confidence_percent'] as num?;
              final priority =
                  (opportunity['priority'] ?? 'medium').toString().toLowerCase();
              final priorityColor = _opportunityPriorityColor(priority);
              final rank = opportunity['rank_value'];
              final address =
                  (opportunity['full_address'] ?? 'Address unavailable').toString();
              final signal =
                  (opportunity['top_signal_type'] ?? 'No top signal').toString();
              final events = (opportunity['event_count'] as num?)?.toInt() ?? 0;
              final distinctSignals =
                  (opportunity['distinct_signal_count'] as num?)?.toInt() ?? 0;
              final stage = (opportunity['stage'] ?? 'monitor').toString();
              final action =
                  (opportunity['recommended_action'] ?? 'Continue monitoring').toString();

              final chips = <Widget>[
                _OpportunityChip(label: priority.toUpperCase(), color: priorityColor),
                _OpportunityChip(
                  label: stage.replaceAll('_', ' ').toUpperCase(),
                  color: AppTheme.blue,
                ),
                _OpportunityChip(label: '$events EVENTS', color: AppTheme.cyan),
                _OpportunityChip(
                  label: '$distinctSignals SIGNALS',
                  color: AppTheme.green,
                ),
              ];

              Widget rankBlock({required bool compact}) => Container(
                width: compact ? 52 : 58,
                padding: compact
                    ? const EdgeInsets.symmetric(vertical: 7)
                    : EdgeInsets.zero,
                decoration: compact
                    ? BoxDecoration(
                        color: AppTheme.cyan.withOpacity(.07),
                        borderRadius: BorderRadius.circular(10),
                      )
                    : null,
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Text(
                      rank == null ? '—' : '#$rank',
                      style: const TextStyle(
                        color: AppTheme.cyan,
                        fontSize: 16,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                    const SizedBox(height: 4),
                    Text(
                      score == null ? '—' : score.toStringAsFixed(1),
                      style: const TextStyle(
                        color: Colors.white,
                        fontSize: 12,
                        fontWeight: FontWeight.w800,
                      ),
                    ),
                  ],
                ),
              );

              Widget identity({required bool compact}) => Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(
                    address,
                    maxLines: compact ? 2 : 1,
                    overflow: TextOverflow.ellipsis,
                    style: const TextStyle(
                      color: Colors.white,
                      fontSize: 13,
                      fontWeight: FontWeight.w800,
                    ),
                  ),
                  const SizedBox(height: 5),
                  Text(
                    '${opportunity['model_name'] ?? opportunity['model_key'] ?? 'BridgePoint'} • $signal',
                    maxLines: compact ? 2 : 1,
                    overflow: TextOverflow.ellipsis,
                    style: const TextStyle(
                      color: AppTheme.textMuted,
                      fontSize: 10,
                      height: 1.35,
                    ),
                  ),
                ],
              );

              return InkWell(
                onTap: () => _showOpportunityDetail(context, opportunity),
                borderRadius: BorderRadius.circular(14),
                child: Container(
                  margin: const EdgeInsets.only(bottom: 10),
                  padding: const EdgeInsets.all(15),
                  decoration: BoxDecoration(
                    color: AppTheme.panelSoft.withOpacity(0.50),
                    borderRadius: BorderRadius.circular(14),
                    border: Border.all(color: Colors.white.withOpacity(0.06)),
                  ),
                  child: LayoutBuilder(
                    builder: (context, constraints) {
                      final compact = constraints.maxWidth < 720;
                      if (compact) {
                        return Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                rankBlock(compact: true),
                                const SizedBox(width: 11),
                                Expanded(child: identity(compact: true)),
                                const SizedBox(width: 5),
                                const Icon(
                                  Icons.chevron_right_rounded,
                                  color: AppTheme.textMuted,
                                  size: 20,
                                ),
                              ],
                            ),
                            const SizedBox(height: 11),
                            Wrap(spacing: 6, runSpacing: 6, children: chips),
                            const SizedBox(height: 11),
                            Text(
                              confidence == null
                                  ? 'Confidence —'
                                  : 'Confidence ${confidence.toStringAsFixed(0)}%',
                              style: const TextStyle(
                                color: AppTheme.textMuted,
                                fontSize: 9,
                                fontWeight: FontWeight.w700,
                              ),
                            ),
                            const SizedBox(height: 5),
                            Text(
                              action,
                              maxLines: 3,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(
                                color: Colors.white,
                                fontSize: 10,
                                fontWeight: FontWeight.w700,
                                height: 1.35,
                              ),
                            ),
                          ],
                        );
                      }

                      return Row(
                        children: [
                          rankBlock(compact: false),
                          Container(
                            width: 1,
                            height: 52,
                            color: Colors.white.withOpacity(0.07),
                          ),
                          const SizedBox(width: 14),
                          Expanded(flex: 4, child: identity(compact: false)),
                          Expanded(
                            flex: 3,
                            child: Wrap(spacing: 6, runSpacing: 6, children: chips),
                          ),
                          const SizedBox(width: 12),
                          SizedBox(
                            width: 145,
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.end,
                              children: [
                                Text(
                                  confidence == null
                                      ? 'Confidence —'
                                      : 'Confidence ${confidence.toStringAsFixed(0)}%',
                                  style: const TextStyle(
                                    color: AppTheme.textMuted,
                                    fontSize: 9,
                                    fontWeight: FontWeight.w700,
                                  ),
                                ),
                                const SizedBox(height: 5),
                                Text(
                                  action,
                                  textAlign: TextAlign.right,
                                  maxLines: 2,
                                  overflow: TextOverflow.ellipsis,
                                  style: const TextStyle(
                                    color: Colors.white,
                                    fontSize: 10,
                                    fontWeight: FontWeight.w700,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          const SizedBox(width: 8),
                          const Icon(
                            Icons.chevron_right_rounded,
                            color: AppTheme.textMuted,
                            size: 20,
                          ),
                        ],
                      );
                    },
                  ),
                ),
              );
            }
          }

          '''
          src = src[:start] + card + src[end:]

          path.write_text(src)
          Path('.github/workflows/mobile-responsive-final.yml').unlink()

      - name: Validate source structure
        shell: python
        run: |
          from pathlib import Path
          s = Path('lib/main.dart').read_text()
          required = [
              "'Owner Full Platform': 'all'",
              "if (widget.ownerMode) 'Owner Full Platform'",
              'final compact = constraints.maxWidth < 720;',
              'Expanded(child: identity(compact: true))',
              'Expanded(flex: 4, child: identity(compact: false))',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Missing responsive changes: {missing}')
          if "'All Intelligence': 'all'" in s:
              raise SystemExit('Legacy full-platform customer selector remains')
          if s.count('{') != s.count('}'):
              raise SystemExit('Unbalanced braces')
          if s.count('(') != s.count(')'):
              raise SystemExit('Unbalanced parentheses')
          if s.count('[') != s.count(']'):
              raise SystemExit('Unbalanced brackets')

      - name: Commit final phone layout
        run: |
          git config user.name "BridgePoint Automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart .github/workflows/mobile-responsive-final.yml
          git commit -m "Finish phone-first Flutter responsive layouts"
          git push origin HEAD:main
