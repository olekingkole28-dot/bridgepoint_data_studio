name: Rechunk Clean V2 Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rechunk-clean-v2-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rechunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify compiled handoff and publish temporary release bridge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/old-handoff /tmp/new-handoff
          mkdir -p /tmp/old-handoff /tmp/new-handoff
          git fetch origin clean-v2-handoff:refs/remotes/origin/clean-v2-handoff
          git archive --format=tar origin/clean-v2-handoff | tar -xf - -C /tmp/old-handoff
          test -s /tmp/old-handoff/manifest.json
          cat /tmp/old-handoff/chunk-* | base64 -d > /tmp/v2-delta.tar.gz
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('/tmp/old-handoff/manifest.json').read_text())
          a=Path('/tmp/v2-delta.tar.gz').read_bytes()
          actual=hashlib.sha256(a).hexdigest()
          if actual!=m['archive_sha256']:
              raise SystemExit(f'Existing handoff SHA mismatch: {actual} != {m["archive_sha256"]}')
          if m['source_sha']!='a014ccde6df596764907aa2d3daf237049e75e90':
              raise SystemExit('Unexpected Clean V2 source SHA')
          print(f'Verified compiled Clean V2 handoff: {len(a)} bytes, sha256={actual}')
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/gzip' \
            -H 'cache-control: no-cache' \
            --data-binary @/tmp/v2-delta.tar.gz \
            "${SUPABASE_URL}/storage/v1/object/bridgepoint-release-handoff/clean-v2-a014ccde6df596764907aa2d3daf237049e75e90.tar.gz"
          echo
          echo 'Temporary verified Clean V2 release bridge uploaded.'

          base64 -w0 /tmp/v2-delta.tar.gz > /tmp/v2-delta.tar.gz.b64
          split -b 12000 -d -a 3 /tmp/v2-delta.tar.gz.b64 /tmp/new-handoff/chunk-
          cp /tmp/old-handoff/manifest.json /tmp/new-handoff/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/new-handoff/manifest.json')
          m=json.loads(p.read_text())
          m['chunk_count']=len(list(Path('/tmp/new-handoff').glob('chunk-*')))
          m['chunk_size']=12000
          m['rechunked_for']='connector-safe-cross-repo-transfer'
          p.write_text(json.dumps(m,separators=(',',':'))+'\n')
          print(p.read_text())
          PY
          cd /tmp/new-handoff
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b clean-v2-handoff
          git add -A
          git commit -m 'Rechunk Clean V2 handoff for verified public transfer'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin clean-v2-handoff
