name: Publish Restored Clean V2 Release Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rechunk-clean-v2-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verify and upload exact restored release
        env:
          SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25
          EXPECTED_SOURCE: f0931d0363ecc72fd471c9065ec7c9eb9e41c1f3
          EXPECTED_SHA: 29ee7b7cdc652915ec6d08ec668c77cb78c680938ea7b3b5f418f9efc3412b13
          RELEASE_OBJECT: clean-v2-f0931d0363ecc72fd471c9065ec7c9eb9e41c1f3.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-handoff
          mkdir -p /tmp/v2-handoff
          git fetch origin clean-v2-handoff:refs/remotes/origin/clean-v2-handoff
          git archive --format=tar origin/clean-v2-handoff | tar -xf - -C /tmp/v2-handoff
          test -s /tmp/v2-handoff/manifest.json
          cat /tmp/v2-handoff/chunk-* | base64 -d > /tmp/v2-delta.tar.gz
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest=json.loads(Path('/tmp/v2-handoff/manifest.json').read_text())
          archive=Path('/tmp/v2-delta.tar.gz').read_bytes()
          actual=hashlib.sha256(archive).hexdigest()
          expected_source=os.environ['EXPECTED_SOURCE']
          expected_sha=os.environ['EXPECTED_SHA']
          if manifest.get('source_sha') != expected_source:
              raise SystemExit(f"Source mismatch: {manifest.get('source_sha')} != {expected_source}")
          if manifest.get('archive_sha256') != expected_sha or actual != expected_sha:
              raise SystemExit(f"Archive SHA mismatch: manifest={manifest.get('archive_sha256')} actual={actual} expected={expected_sha}")
          if manifest.get('archive_bytes') != len(archive):
              raise SystemExit(f"Archive byte mismatch: {len(archive)} != {manifest.get('archive_bytes')}")
          if manifest.get('saved_alerts_restored') is not True:
              raise SystemExit('Saved & Alerts release marker missing')
          if manifest.get('brand_asset_included') is not True:
              raise SystemExit('Brand asset release marker missing')
          print(f"Verified restored Clean V2: source={expected_source}, bytes={len(archive)}, sha256={actual}")
          PY
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/gzip' \
            -H 'cache-control: no-cache' \
            --data-binary @/tmp/v2-delta.tar.gz \
            "${SUPABASE_URL}/storage/v1/object/bridgepoint-release-handoff/${RELEASE_OBJECT}"
          echo
          echo "Uploaded ${RELEASE_OBJECT}"
