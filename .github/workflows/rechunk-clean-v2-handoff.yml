# Exact-object retry after scoped Storage insert gate
name: Publish Restored Clean V2 Release Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rechunk-clean-v2-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verify and upload exact visual release
        env:
          SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25
          EXPECTED_SOURCE: 07acf9c98d403d00c7ccebb674bbf6ae8a85a9da
          EXPECTED_SHA: d4cec61a85f19c8f3ee40b75ab5feed7a8ada284d8b5728b894532c5a2c636a8
          EXPECTED_FONT_SHA: 88446f8efaaddc0939fdc3dfb35ef41ad35f730b5e0715f9d401d3f3ef3d15d0
          EXPECTED_SPACE_SHA: acad6de1fc93436f5c0f1f4137751ef04f1aea3063e7036535970ffcfbd79f72
          RELEASE_OBJECT: clean-v2-07acf9c98d403d00c7ccebb674bbf6ae8a85a9da.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-handoff /tmp/v2-verify
          mkdir -p /tmp/v2-handoff /tmp/v2-verify
          git fetch origin clean-v2-handoff:refs/remotes/origin/clean-v2-handoff
          git archive --format=tar origin/clean-v2-handoff | tar -xf - -C /tmp/v2-handoff
          test -s /tmp/v2-handoff/manifest.json
          cat /tmp/v2-handoff/chunk-* | base64 -d > /tmp/v2-delta.tar.gz
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          manifest=json.loads(Path('/tmp/v2-handoff/manifest.json').read_text())
          archive=Path('/tmp/v2-delta.tar.gz').read_bytes()
          actual=hashlib.sha256(archive).hexdigest()
          expected_source=os.environ['EXPECTED_SOURCE']
          expected_sha=os.environ['EXPECTED_SHA']
          expected_font=os.environ['EXPECTED_FONT_SHA']
          expected_space=os.environ['EXPECTED_SPACE_SHA']
          if manifest.get('source_sha') != expected_source:
              raise SystemExit(f"Source mismatch: {manifest.get('source_sha')} != {expected_source}")
          if manifest.get('archive_sha256') != expected_sha or actual != expected_sha:
              raise SystemExit(f"Archive SHA mismatch: manifest={manifest.get('archive_sha256')} actual={actual} expected={expected_sha}")
          if manifest.get('archive_bytes') != len(archive):
              raise SystemExit(f"Archive byte mismatch: {len(archive)} != {manifest.get('archive_bytes')}")
          for flag in ['restored_product_surfaces','progressive_national_map','saved_alerts_restored','opportunities_restored','visual_polish_v2','property_dossier_v2','property_visuals_v2','operations_product_ui_v2','fullscreen_property_dossier_v2','engine_health_v777','requirements_contract_v832','material_icon_font_included','space_grotesk_included']:
              if manifest.get(flag) is not True:
                  raise SystemExit(f'{flag} marker missing')
          if manifest.get('brand_font') != 'SpaceGrotesk':
              raise SystemExit('Space Grotesk brand font marker missing')
          if manifest.get('material_icon_font_sha256') != expected_font:
              raise SystemExit('Material icon font manifest SHA mismatch')
          if manifest.get('space_grotesk_sha256') != expected_space:
              raise SystemExit('Space Grotesk manifest SHA mismatch')
          with tarfile.open('/tmp/v2-delta.tar.gz','r:gz') as tf:
              tf.extractall('/tmp/v2-verify')
          font=Path('/tmp/v2-verify/assets/fonts/MaterialIcons-Regular.otf')
          if not font.is_file(): raise SystemExit('Current Material icon font missing from archive')
          font_sha=hashlib.sha256(font.read_bytes()).hexdigest()
          if font_sha != expected_font: raise SystemExit(f'Material font SHA mismatch: {font_sha} != {expected_font}')
          space_files=list(Path('/tmp/v2-verify/assets').rglob('SpaceGrotesk.ttf'))
          if len(space_files) != 1: raise SystemExit(f'Expected one bundled SpaceGrotesk.ttf, found {len(space_files)}')
          space_sha=hashlib.sha256(space_files[0].read_bytes()).hexdigest()
          if space_sha != expected_space: raise SystemExit(f'Space Grotesk SHA mismatch: {space_sha} != {expected_space}')
          print(json.dumps({'source':expected_source,'bytes':len(archive),'archive_sha256':actual,'material_icon_sha256':font_sha,'space_grotesk_sha256':space_sha},indent=2))
          PY
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/gzip' \
            -H 'cache-control: no-cache' \
            --data-binary @/tmp/v2-delta.tar.gz \
            "${SUPABASE_URL}/storage/v1/object/bridgepoint-release-handoff/${RELEASE_OBJECT}"
          echo
          echo "Uploaded ${RELEASE_OBJECT}"
