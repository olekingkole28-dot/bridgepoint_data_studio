name: Publish Restored Clean V2 Release Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rechunk-clean-v2-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verify and upload exact restored release
        env:
          SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25
          EXPECTED_SOURCE: b9f6aa060641a132de9ef884c11d515d897d330f
          EXPECTED_SHA: e0d74227f7904723cc6ca51f3bd275a1b870b2473e18716d7c59227286555158
          EXPECTED_FONT_SHA: 0df8f065d89ba11840a32e4783e7fde12eebff11a594d9b76190e5ceded95a81
          RELEASE_OBJECT: clean-v2-b9f6aa060641a132de9ef884c11d515d897d330f.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-handoff /tmp/v2-verify
          mkdir -p /tmp/v2-handoff /tmp/v2-verify
          git fetch origin clean-v2-handoff:refs/remotes/origin/clean-v2-handoff
          git archive --format=tar origin/clean-v2-handoff | tar -xf - -C /tmp/v2-handoff
          test -s /tmp/v2-handoff/manifest.json
          cat /tmp/v2-handoff/chunk-* | base64 -d > /tmp/v2-delta.tar.gz
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          manifest=json.loads(Path('/tmp/v2-handoff/manifest.json').read_text())
          archive=Path('/tmp/v2-delta.tar.gz').read_bytes()
          actual=hashlib.sha256(archive).hexdigest()
          expected_source=os.environ['EXPECTED_SOURCE']
          expected_sha=os.environ['EXPECTED_SHA']
          expected_font=os.environ['EXPECTED_FONT_SHA']
          if manifest.get('source_sha') != expected_source:
              raise SystemExit(f"Source mismatch: {manifest.get('source_sha')} != {expected_source}")
          if manifest.get('archive_sha256') != expected_sha or actual != expected_sha:
              raise SystemExit(f"Archive SHA mismatch: manifest={manifest.get('archive_sha256')} actual={actual} expected={expected_sha}")
          if manifest.get('archive_bytes') != len(archive):
              raise SystemExit(f"Archive byte mismatch: {len(archive)} != {manifest.get('archive_bytes')}")
          if manifest.get('saved_alerts_restored') is not True or manifest.get('opportunities_restored') is not True:
              raise SystemExit('Restored product marker missing')
          if manifest.get('brand_asset_included') is not True:
              raise SystemExit('Brand asset release marker missing')
          if manifest.get('material_icon_font_included') is not True:
              raise SystemExit('Material icon font marker missing')
          if manifest.get('material_icon_font_sha256') != expected_font:
              raise SystemExit('Material icon font manifest SHA mismatch')
          with tarfile.open('/tmp/v2-delta.tar.gz','r:gz') as tf:
              tf.extractall('/tmp/v2-verify')
          font=Path('/tmp/v2-verify/assets/fonts/MaterialIcons-Regular.otf')
          if not font.is_file(): raise SystemExit('Current Material icon font missing from archive')
          font_sha=hashlib.sha256(font.read_bytes()).hexdigest()
          if font_sha != expected_font: raise SystemExit(f'Font SHA mismatch: {font_sha} != {expected_font}')
          print(f"Verified map-polished Clean V2: source={expected_source}, bytes={len(archive)}, archive_sha256={actual}, font_sha256={font_sha}")
          PY
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/gzip' \
            -H 'cache-control: no-cache' \
            --data-binary @/tmp/v2-delta.tar.gz \
            "${SUPABASE_URL}/storage/v1/object/bridgepoint-release-handoff/${RELEASE_OBJECT}"
          echo
          echo "Uploaded ${RELEASE_OBJECT}"
