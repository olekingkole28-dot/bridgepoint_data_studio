name: Harden BridgePoint World V2500 runtime
on:
  push:
    branches: [bridgepoint-world-v2500]
    paths:
      - 'scripts/harden_world_v2500_runtime.py'
      - '.github/workflows/world-v2500-repair-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridgepoint-world-v2500
          fetch-depth: 1
      - name: Apply idempotent V2500 runtime hardening
        run: python3 scripts/harden_world_v2500_runtime.py
      - name: Parse hardened runtime
        run: |
          node --check web/bridgepoint-3d-world/world-v2500.js
          node --check web/bridgepoint-3d-world/world-v2500-inspector.js
      - name: Assert hardening markers
        run: |
          grep -q 'viewportPending:false' web/bridgepoint-3d-world/world-v2500.js
          grep -q 'weatherPending:false' web/bridgepoint-3d-world/world-v2500.js
          grep -q 'maximumLevel: 23' web/bridgepoint-3d-world/world-v2500.js
          grep -q 'allowGeometry:false' web/bridgepoint-3d-world/world-v2500.js
          grep -q 'clearPropertyGeometry({resetKey:false})' web/bridgepoint-3d-world/world-v2500.js
          grep -q 'touch-action:pan-y' web/bridgepoint-3d-world/world-v2500.css
      - name: Commit hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint World Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add web/bridgepoint-3d-world/world-v2500.js web/bridgepoint-3d-world/world-v2500.css
          if git diff --cached --quiet; then
            echo 'V2500 hardening already applied.'
            exit 0
          fi
          git commit -m 'Harden World V2500 interaction rendering and weather truth'
          git push origin HEAD:bridgepoint-world-v2500
