name: Repair BridgePoint World V2500 runtime contracts
on:
  push:
    branches: [bridgepoint-world-v2500]
    paths:
      - 'scripts/repair_world_v2500_runtime.py'
      - '.github/workflows/world-v2500-repair-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridgepoint-world-v2500
          fetch-depth: 1
      - name: Apply exact V2500 runtime repairs
        run: python3 scripts/repair_world_v2500_runtime.py
      - name: Parse repaired runtime
        run: |
          node --check web/bridgepoint-3d-world/world-v2500.js
          node --check web/bridgepoint-3d-world/world-v2500-inspector.js
      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint World Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add web/bridgepoint-3d-world/world-v2500.js web/bridgepoint-3d-world/world-v2500.css
          if git diff --cached --quiet; then
            echo 'V2500 runtime contracts already repaired.'
            exit 0
          fi
          git commit -m 'Harden World V2500 interaction rendering and weather runtime'
          git push origin HEAD:bridgepoint-world-v2500
