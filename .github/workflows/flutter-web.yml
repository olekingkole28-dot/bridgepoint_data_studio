name: Legacy Flutter Web Release — Disabled

on:
  workflow_dispatch:

# The historical BridgePoint release pipeline replayed dozens of source-mutating
# patch scripts before every build. Clean V2 replaces that architecture with the
# deterministic flutter-web-v2-production.yml pipeline, which builds lib/main_v2.dart
# directly and verifies the live release marker after GitHub Pages deployment.
#
# This workflow intentionally performs no deployment. The pre-V2 production commit
# remains available in Git history as the rollback point if a Clean V2 cutover must
# be reverted.

jobs:
  retired:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Legacy pipeline retired
        run: |
          echo "Legacy patch replay is disabled."
          echo "Use BridgePoint Clean V2 Production for releases."
          echo "Rollback by reverting the Clean V2 cutover commit if required."
