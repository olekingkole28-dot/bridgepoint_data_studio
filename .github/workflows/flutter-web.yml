name: Flutter Web Review Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests when present
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory yet; continuing to the release build."
          fi
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-flutter-web-review
          path: build/web
          retention-days: 14
