name: Flutter Web Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bridgepoint-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded BridgePoint launch fixes
        run: |
          set -euo pipefail
          python tool/repair_v94_script.py
          python tool/apply_launch_v94.py
          python tool/repair_owner_expansion_v96.py
          python tool/apply_launch_v95.py
          python tool/apply_satellite_map_v98.py
          python tool/apply_map_viewport_v124.py
          python tool/apply_technology_clarity_v100.py
          python tool/apply_exports_v101.py
          python tool/apply_growth_center_v105.py
          python tool/apply_notification_center_v109.py
          python tool/apply_owner_recent_people_v112.py
          python tool/apply_social_publish_v120.py
          python tool/apply_social_connect_v123.py
          python tool/apply_launch_readiness_v121.py
          python tool/apply_weather_home_community_v145.py
          python tool/repair_weather_home_v147.py
          python tool/apply_numbered_sales_posts_v146.py
          python tool/apply_copyright_footer_v150.py
          python tool/apply_about_bridgepoint_v151.py
          python tool/apply_routes_offline_v157.py
          python tool/apply_training_demo_founder_v159.py
          python tool/repair_generated_release_v160.py
          python tool/fix_legal_gate_v160.py
          python tool/apply_package_colors_molly_update_v162.py
          python tool/apply_pwa_auto_update_v162.py
          python tool/apply_dashboard_widgets_property_media_v164.py
          python tool/repair_dashboard_media_v166.py
          python tool/apply_property_imagery_history_ui_v169.py
          python tool/apply_molly_companion_v165.py
          printf '{"version":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > web/bridgepoint-release.json
          python - <<'PY'
          from pathlib import Path
          checks={
            'lib/main.dart':[
              'Send to CRM','Weather Center','My Home','Community Property Observations',
              'Property photo not available yet','ROUTES & OFFLINE MODE',
              'Connection looks spotty — switch to Offline Mode?','Skip for now',
              'Founder Command Center','Preview as customer',"MOLLY'S TIP",
              'ENTERPRISE TECHNOLOGY','MY DASHBOARD WIDGETS','Customize Dashboard',
              '_PropertyMediaCard','Property Image History','Image history •',
              '_bridgePointRelease','Questions or Concerns: 203-605-2389',
            ],
            'web/index.html':['bridgepoint_auto_update_restoring','bridgepoint-release.json'],
          }
          missing=[]
          for filename,needles in checks.items():
            body=Path(filename).read_text(encoding='utf-8')
            for needle in needles:
              if needle not in body: missing.append(f'{filename}: {needle}')
          if missing:
            print('Missing guarded release markers:')
            for item in missing: print(' -',item)
            raise SystemExit(1)
          print('All guarded release markers are present.')
          PY
          test -s web/bridgepoint-release.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests when present
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory yet; continuing to the release build."
          fi
      - name: Build installable web app
        run: flutter build web --release --base-href "/" --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
      - uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-flutter-web-review
          path: build/web
          retention-days: 14
      - name: Configure GitHub Pages when supported
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact when supported
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish BridgePoint Intelligence
        id: deployment
        uses: actions/deploy-pages@v4
