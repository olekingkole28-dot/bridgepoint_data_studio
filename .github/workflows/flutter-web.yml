name: Flutter Web Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bridgepoint-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded BridgePoint launch fixes
        run: |
          python tool/repair_v94_script.py
          python tool/apply_launch_v94.py
          python tool/repair_owner_expansion_v96.py
          python tool/apply_launch_v95.py
          python tool/apply_satellite_map_v98.py
          python tool/apply_map_viewport_v124.py
          python tool/apply_technology_clarity_v100.py
          python tool/apply_exports_v101.py
          python tool/apply_growth_center_v105.py
          python tool/apply_notification_center_v109.py
          python tool/apply_owner_recent_people_v112.py
          python tool/apply_social_publish_v120.py
          python tool/apply_social_connect_v123.py
          python tool/apply_launch_readiness_v121.py
          python tool/apply_weather_home_community_v145.py
          python tool/repair_weather_home_v147.py
          python tool/apply_numbered_sales_posts_v146.py
          python tool/apply_copyright_footer_v150.py
          python tool/apply_about_bridgepoint_v151.py
          python tool/apply_routes_offline_v157.py
          python tool/apply_training_demo_founder_v159.py
          python tool/repair_generated_release_v160.py
          python tool/fix_legal_gate_v160.py
          python tool/apply_package_colors_molly_update_v162.py
          python tool/apply_pwa_auto_update_v162.py
          printf '{"version":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > web/bridgepoint-release.json
          grep -q "Send to CRM" lib/main.dart
          grep -q "Download CSV" lib/main.dart
          grep -q "Print / Save PDF" lib/main.dart
          grep -q "Show United States live weather" lib/main.dart
          grep -q "onPositionChanged" lib/main.dart
          grep -q "WEATHER_OVERVIEW" lib/main.dart
          grep -q "One-click State Expansion" lib/main.dart
          grep -q "ENTERPRISE TECHNOLOGY" lib/main.dart
          grep -q "Who this technology is for" lib/main.dart
          grep -q "Satellite (default)" lib/main.dart
          grep -q "Growth & Outreach Engine" lib/main.dart
          grep -q "Notification Center" lib/main.dart
          grep -q "Recent People Using BridgePoint" lib/main.dart
          grep -q "Publish connected now" lib/main.dart
          grep -q "TOKENS STORED IN VAULT" lib/main.dart
          grep -q "YOUTUBE_SHORTS" lib/main.dart
          grep -q "Launch Readiness" lib/main.dart
          grep -q "Weather Center" lib/main.dart
          grep -q "My Home" lib/main.dart
          grep -q "Community Property Observations" lib/main.dart
          grep -q "Property photo not available yet" lib/main.dart
          grep -q "TODAY’S SIX SALES POSTS" lib/main.dart
          grep -q "Post #\$slot to ALL connected socials" lib/main.dart
          grep -q "© 2026 BridgePoint Intelligence. All rights reserved." lib/main.dart
          grep -q "Questions or Concerns: 203-605-2389" lib/main.dart
          grep -q "ABOUT BRIDGEPOINT INTELLIGENCE" lib/main.dart
          grep -q "ROUTES & OFFLINE MODE" lib/main.dart
          grep -q "Connection looks spotty — switch to Offline Mode?" lib/main.dart
          grep -q "Skip for now" lib/main.dart
          grep -q "Owner Demo Mode" lib/main.dart
          grep -q "Founder Command Center" lib/main.dart
          grep -q "FULL-ACCESS OWNERS" lib/main.dart
          grep -q "Preview as customer" lib/main.dart
          grep -q "requiredKeys" lib/main.dart
          grep -q "MOLLY'S TIP" lib/main.dart
          grep -q "ENTERPRISE TECHNOLOGY" lib/main.dart
          grep -q "bridgepoint_auto_update_restoring" web/index.html
          grep -q "bridgepoint-release.json" web/index.html
          grep -q "_bridgePointRelease" lib/main.dart
          test -s web/bridgepoint-release.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests when present
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory yet; continuing to the release build."
          fi
      - name: Build installable web app
        run: flutter build web --release --base-href "/bridgepoint_data_studio/" --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
      - uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-flutter-web-review
          path: build/web
          retention-days: 14
      - name: Configure GitHub Pages when supported
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact when supported
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish BridgePoint Intelligence
        id: deployment
        uses: actions/deploy-pages@v4
