# trigger v2
name: Wire Source 3D V843

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-source-3d-v843.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire source surface model into shared geometry viewer
        shell: python
        run: |
          from pathlib import Path
          p=Path('lib/v2/bridgepoint_building_geometry_v2.dart')
          s=p.read_text()
          if "bridgepoint_source_surface_model_v2.dart" not in s:
              s=s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:supabase_flutter/supabase_flutter.dart';\n\nimport 'bridgepoint_source_surface_model_v2.dart';\n")
          anchor="  bool _massing = true;\n"
          if "Map<String, dynamic> _source3d" not in s:
              s=s.replace(anchor, anchor+"  Map<String, dynamic> _source3d = const {};\n  bool _source3dLoading = false;\n\n  @override\n  void initState() {\n    super.initState();\n    _loadSource3d();\n  }\n\n  @override\n  void didUpdateWidget(covariant BridgePointBuildingGeometryV2 oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if ('${oldWidget.payload['property_id'] ?? ''}' != '${widget.payload['property_id'] ?? ''}') {\n      _source3d = const {};\n      _loadSource3d();\n    }\n  }\n\n  Future<void> _loadSource3d() async {\n    final id = '${widget.payload['property_id'] ?? ''}'.trim();\n    if (id.isEmpty || _source3dLoading) return;\n    if (mounted) setState(() => _source3dLoading = true);\n    try {\n      final raw = await Supabase.instance.client.rpc(\n        'bridgepoint_property_source_3d_v843',\n        params: {'p_property_id': id},\n      );\n      if (!mounted) return;\n      setState(() {\n        _source3d = raw is Map<String, dynamic>\n            ? raw\n            : raw is Map\n                ? Map<String, dynamic>.from(raw)\n                : const {};\n      });\n    } catch (_) {\n      // Detailed source 3D is additive. The verified footprint/massing fallback below remains available.\n    } finally {\n      if (mounted) setState(() => _source3dLoading = false);\n    }\n  }\n")
          old="            _header(!locked && rows.isNotEmpty),\n            const SizedBox(height: 12),\n"
          new="            _header(!locked && rows.isNotEmpty),\n            if (_source3dLoading) ...[\n              const SizedBox(height: 10),\n              const LinearProgressIndicator(minHeight: 2),\n            ],\n            if (_source3d['available'] == true) ...[\n              const SizedBox(height: 12),\n              BridgePointSourceSurfaceModelV2(payload: _source3d),\n              const SizedBox(height: 12),\n              const Text(\n                'Footprint / schematic fallback',\n                style: TextStyle(fontWeight: FontWeight.w900, fontSize: 13),\n              ),\n            ],\n            const SizedBox(height: 12),\n"
          if old not in s:
              raise SystemExit('geometry build anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit source 3D wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint 3D Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_building_geometry_v2.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render source-backed 3D surfaces across BridgePoint'
          git push origin HEAD:main
