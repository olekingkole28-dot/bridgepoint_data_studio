name: Apply Localization V711 Clean

on:
  push:
    branches:
      - chatgpt/localization-v711-clean
    paths:
      - tool/trigger_localization_v711_clean.txt
      - .github/workflows/apply-localization-v711-clean.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-localization-v711-clean
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/localization-v711-clean
          fetch-depth: 0
      - name: Fetch proven patcher and apply only localization
        run: |
          set -euo pipefail
          git fetch origin chatgpt/ui-refresh-v691
          git show origin/chatgpt/ui-refresh-v691:tool/apply_localization_v711.py > /tmp/apply_localization_v711.py
          python /tmp/apply_localization_v711.py
          grep -q 'bridgepoint-localization-v711' lib/main.dart
          grep -q 'home: const _LanguageBootstrap(),' lib/main.dart
          grep -q 'bridgepoint_supported_languages_v711' lib/main.dart
          grep -q 'bridgepoint_save_locale_v711' lib/main.dart
      - name: Verify Flutter build surface
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Persist only production source change
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Localization Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f tool/trigger_localization_v711_clean.txt .github/workflows/apply-localization-v711-clean.yml
          git add lib/main.dart
          git checkout -- pubspec.lock 2>/dev/null || true
          git commit -m 'Add first-run 27-language selector V711 [skip ci]'
          git push origin HEAD:chatgpt/localization-v711-clean
