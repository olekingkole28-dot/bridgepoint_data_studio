name: Repair v188 whitespace matchers

on:
  push:
    branches: [mobile-v325-release-compat]
    paths:
      - '.github/workflows/v188-marker-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v325-release-compat
      - shell: python
        run: |
          from pathlib import Path
          p=Path('tool/apply_multistate_owner_ui_v188.py')
          s=p.read_text()
          s=s.replace('chips_start="""      final chips = <Widget>[', 'chips_start="""    final chips = <Widget>[')
          s=s.replace('chip_owner="""      final chips = <Widget>[', 'chip_owner="""    final chips = <Widget>[')
          s=s.replace('facts_old="""      final facts = [', 'facts_old="""    final facts = [')
          s=s.replace('facts_new="""      final facts = [', 'facts_new="""    final facts = [')
          s=s.replace('old_identity="""                        Text([municipality,', 'old_identity="""              Text([municipality,')
          s=s.replace('new_identity="""                        Text([municipality,', 'new_identity="""              Text([municipality,')
          p.write_text(s)
          Path('.github/workflows/v188-marker-fix.yml').unlink()
      - run: |
          git config user.name 'BridgePoint Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Make v188 match responsive card formatting'
          git push origin HEAD:mobile-v325-release-compat
