name: Repair v321 partial patch conflicts

on:
  push:
    branches: [mobile-v325-release-compat]
    paths:
      - '.github/workflows/v321-partial-patch-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v325-release-compat
          fetch-depth: 0
      - name: Let safe v321 hunks merge and repair the three expected conflicts
        shell: python
        run: |
          from pathlib import Path
          p=Path('tool/apply_resilience_expansion_radar_v321.py')
          s=p.read_text()
          old='subprocess.run(["patch","--batch","--forward","--reject-file=-","-p0"],input=patch,check=True)'
          new="""result=subprocess.run([\"patch\",\"--batch\",\"--forward\",\"--reject-file=-\",\"-p0\"],input=patch,check=False)\nif result.returncode not in (0,1):\n    raise SystemExit(f'v321 patch command failed unexpectedly with exit {result.returncode}')\nsubprocess.run(['python','tool/repair_v321_responsive_generated.py'],check=True)"""
          if old not in s:
              if 'repair_v321_responsive_generated.py' in s:
                  print('v321 structural repair hook already installed')
              else:
                  raise SystemExit('v321 patch invocation not found')
          else:
              p.write_text(s.replace(old,new,1))
          Path('.github/workflows/v321-partial-patch-repair.yml').unlink()
      - name: Commit repair
        run: |
          git config user.name 'BridgePoint Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Repair v321 radar conflicts structurally on responsive source'
          git push origin HEAD:mobile-v325-release-compat
