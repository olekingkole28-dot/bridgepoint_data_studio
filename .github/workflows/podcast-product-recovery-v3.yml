name: BridgePoint Podcast Product Recovery V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/podcast-product-recovery-v3.yml'

permissions:
  contents: write

concurrency:
  group: bridgepoint-podcast-product-recovery-v3
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded product recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # --- Property dossier: street imagery + richer one-page property story ---
          path = 'lib/v2/bridgepoint_property_dossier_v2.dart'
          s = read(path)
          s = replace_once(
              s,
              "import 'bridgepoint_building_geometry_v2.dart';\n",
              "import 'bridgepoint_building_geometry_v2.dart';\nimport 'bridgepoint_property_presentation_v2.dart';\n",
              'dossier presentation import',
          )
          s = replace_once(s, '  int _visual = 0;\n', '  int _visual = -1;\n', 'dossier visual default')
          s = replace_once(
              s,
              "        _safe('bridgepoint_property_photo_contributions_v266', {\n          'p_property_id': widget.propertyId,\n        }),\n      ]);",
              "        _safe('bridgepoint_property_photo_contributions_v266', {\n          'p_property_id': widget.propertyId,\n        }),\n        _safe('bridgepoint_property_media_bundle_v169', {\n          'p_property_id': widget.propertyId,\n        }),\n        _safe('bridgepoint_property_climate_profile_v510', {\n          'p_property_id': widget.propertyId,\n        }),\n        '${widget.seed['municipality'] ?? ''}'.trim().isEmpty\n            ? Future.value(const <String, dynamic>{'available': false})\n            : _safe('bridgepoint_flutter_permit_context_v68', {\n                'p_municipality': '${widget.seed['municipality']}',\n              }),\n      ]);",
              'dossier load expansion',
          )

          visual_pattern = re.compile(
              r"  Widget _visualSwitcher\(bool hasAerial, bool hasFront, bool hasModel\) \{.*?\n  \}\n\n  Widget _aerialView",
              re.S,
          )
          visual_replacement = r'''  Widget _visualSwitcher(
    bool hasStreet,
    bool hasAerial,
    bool hasModel,
    int selectedVisual,
  ) {
    final choices = <ButtonSegment<int>>[
      ButtonSegment(
        value: 0,
        icon: const Icon(Icons.streetview_rounded),
        label: Text(hasStreet ? 'Street-level' : 'Street soon'),
      ),
      ButtonSegment(
        value: 1,
        icon: const Icon(Icons.satellite_alt_rounded),
        label: Text(hasAerial ? 'Aerial' : 'Aerial soon'),
      ),
      ButtonSegment(
        value: 2,
        icon: const Icon(Icons.view_in_ar_rounded),
        label: Text(hasModel ? '3D / Massing' : 'Geometry'),
      ),
    ];
    return SizedBox(
      width: double.infinity,
      child: SegmentedButton<int>(
        segments: choices,
        selected: {selectedVisual},
        showSelectedIcon: false,
        onSelectionChanged: (v) => setState(() => _visual = v.first),
      ),
    );
  }

  Widget _aerialView'''
          s, n = visual_pattern.subn(visual_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'dossier visual switcher: expected 1 match, found {n}')

          s = replace_once(
              s,
              "          final url = _text(row['media_url'], '');\n          final year = _text(row['captured_year'], 'Aerial');",
              "          final url = _remoteMediaUrl(row);\n          final year = _text(row['captured_year'] ?? row['captured_at'], 'Aerial');",
              'dossier aerial URL',
          )
          s = replace_once(
              s,
              "'$year • ${_text(row['provider'], 'Verified imagery')}',",
              "'$year • ${_text(row['provider'] ?? row['source_name'], 'Verified imagery')}',",
              'dossier aerial provider',
          )

          front_pattern = re.compile(
              r"  Widget _frontView\(List<Map<String, dynamic>> photos\) \{.*?\n  \}\n\n  Widget _facts",
              re.S,
          )
          front_replacement = r'''  String _remoteMediaUrl(Map<String, dynamic> row) {
    for (final key in const [
      'thumbnail_url',
      'preview_url',
      'image_url',
      'media_url',
      'url',
    ]) {
      var value = '${row[key] ?? ''}'.trim();
      if (value.isEmpty || value == 'null') continue;
      value = value.replaceAll('{{sizeprefix}}', 'th');
      if (value.startsWith('http://') || value.startsWith('https://')) {
        return value;
      }
    }
    return '';
  }

  Widget _streetView(
    Map<String, dynamic> street,
    List<Map<String, dynamic>> photos,
  ) {
    if (street.isEmpty) {
      if (photos.isEmpty) {
        return const _VisualEmpty(
          icon: Icons.streetview_outlined,
          title: 'No street-level image linked yet',
          body:
              'BridgePoint has not linked a usable public street-level frame or approved exterior photo to this property yet. Aerial and geometry remain separate and usable.',
        );
      }
      return _SignedPhoto(item: photos.first);
    }

    final url = _remoteMediaUrl(street);
    final metadata = _map(street['metadata']);
    final source = _text(
      street['source_name'] ?? metadata['provider'],
      'Public street-level imagery',
    );
    final captured = _text(street['captured_at'], 'Capture date unavailable');
    final distance = metadata['distance_m'];
    final distanceText = distance is num
        ? ' • ${distance.toStringAsFixed(0)} m from property point'
        : '';

    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        ClipRRect(
          borderRadius: BorderRadius.circular(18),
          child: SizedBox(
            height: 360,
            child: url.isEmpty
                ? const _VisualEmpty(
                    icon: Icons.broken_image_outlined,
                    title: 'Street-level source is linked',
                    body: 'The source record exists, but no displayable image URL was returned.',
                  )
                : Image.network(
                    url,
                    fit: BoxFit.cover,
                    errorBuilder: (_, __, ___) => const _VisualEmpty(
                      icon: Icons.broken_image_outlined,
                      title: 'Street-level image could not load',
                      body: 'BridgePoint kept the source record and provenance, but this public frame could not be displayed right now.',
                    ),
                  ),
          ),
        ),
        const SizedBox(height: 8),
        Text(
          '$source • $captured$distanceText',
          style: const TextStyle(color: _muted, fontSize: 12.5, fontWeight: FontWeight.w700),
        ),
        const SizedBox(height: 4),
        const Text(
          'Plain English: this is a nearby public street-level frame selected as a visual reference. It is not automatically proof that the photographed facade is this exact property, and it is never treated as damage evidence by itself.',
          style: TextStyle(color: _amber, fontSize: 11.5, height: 1.4),
        ),
      ],
    );
  }

  Widget _facts'''
          s, n = front_pattern.subn(front_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'dossier street view: expected 1 match, found {n}')

          s = replace_once(
              s,
              "            final photoPayload = values.length > 5 ? values[5] : const {};\n            final p = _property(detail);\n            final aerial = _aerial(imagery);\n            final photos = _photos(photoPayload);",
              "            final photoPayload = values.length > 5 ? values[5] : const {};\n            final mediaBundle = values.length > 6 ? _map(values[6]) : const <String, dynamic>{};\n            final climate = values.length > 7 ? _map(values[7]) : const <String, dynamic>{};\n            final permits = values.length > 8 ? _map(values[8]) : const <String, dynamic>{};\n            final p = _property(detail);\n            final street = _map(mediaBundle['front']);\n            final mediaCurrent = _map(mediaBundle['aerial_current']);\n            final mediaHistory = _rows(mediaBundle['aerial_history'], const ['items', 'history']);\n            final aerial = <Map<String, dynamic>>[\n              if (mediaCurrent.isNotEmpty) mediaCurrent,\n              ...mediaHistory,\n              ..._aerial(imagery),\n            ];\n            final photos = _photos(photoPayload);",
              'dossier payload unpack',
          )
          s = replace_once(
              s,
              "            final address = _text(\n              p['full_address'] ?? widget.seed['full_address'] ?? widget.seed['address'],\n              'Property',\n            );\n\n            return Column(",
              "            final address = _text(\n              p['full_address'] ?? widget.seed['full_address'] ?? widget.seed['address'],\n              'Property',\n            );\n            final hasStreet = street.isNotEmpty || photos.isNotEmpty;\n            final effectiveVisual = _visual >= 0\n                ? _visual\n                : hasStreet\n                    ? 0\n                    : aerial.isNotEmpty\n                        ? 1\n                        : 2;\n\n            return Column(",
              'dossier effective visual',
          )
          s = replace_once(
              s,
              "                      _visualSwitcher(aerial.isNotEmpty, photos.isNotEmpty, geometryRows.isNotEmpty),",
              "                      _visualSwitcher(hasStreet, aerial.isNotEmpty, geometryRows.isNotEmpty, effectiveVisual),",
              'dossier visual switch call',
          )
          s = replace_once(
              s,
              "                        child: _visual == 0\n                            ? _aerialView(aerial)\n                            : _visual == 1\n                                ? _frontView(photos)\n                                : BridgePointBuildingGeometryV2(payload: geometry),",
              "                        child: effectiveVisual == 0\n                            ? _streetView(street, photos)\n                            : effectiveVisual == 1\n                                ? _aerialView(aerial)\n                                : BridgePointBuildingGeometryV2(payload: geometry),",
              'dossier visual body',
          )
          s = replace_once(
              s,
              "                        title: 'See the property first',\n                        subtitle: 'Verified imagery and source-backed geometry before the database details.',",
              "                        title: 'See the property first',\n                        subtitle: 'Street-level imagery, dated aerial imagery and truthful source-backed 3D/massing before the deeper records.',",
              'dossier visual heading',
          )
          s = replace_once(
              s,
              "                      _facts(p),\n                      const SizedBox(height: 22),\n                      _SectionHeader(\n                        eyebrow: 'DIGITAL TWIN',",
              "                      _facts(p),\n                      const SizedBox(height: 22),\n                      const _SectionHeader(\n                        eyebrow: 'WHY IT MATTERS',\n                        title: 'BridgePoint in plain English',\n                        subtitle: 'What is verified, what is only a signal, why it matters now, and what still needs a human check.',\n                        icon: Icons.lightbulb_outline_rounded,\n                      ),\n                      const SizedBox(height: 10),\n                      BridgePointPropertyOverviewV2(payload: _map(detail)),\n                      const SizedBox(height: 22),\n                      const _SectionHeader(\n                        eyebrow: 'RISK CONTEXT',\n                        title: 'Weather, climate and physical risk',\n                        subtitle: 'Screening context that helps decide what to inspect next—not automatic proof of property damage.',\n                        icon: Icons.shield_outlined,\n                      ),\n                      const SizedBox(height: 10),\n                      BridgePointClimateProfileV2(payload: climate),\n                      const SizedBox(height: 22),\n                      _SectionHeader(\n                        eyebrow: 'DIGITAL TWIN',",
              'dossier intelligence sections',
          )
          s = replace_once(
              s,
              "                      const SizedBox(height: 22),\n                      const _SectionHeader(\n                        eyebrow: 'PROPERTY STORY',",
              "                      const SizedBox(height: 22),\n                      const _SectionHeader(\n                        eyebrow: 'PERMITS + PUBLIC RECORDS',\n                        title: 'Permit context',\n                        subtitle: 'Municipal permit context when the source is available. A municipality-level result is not automatically a permit on this exact parcel.',\n                        icon: Icons.construction_outlined,\n                      ),\n                      const SizedBox(height: 10),\n                      BridgePointPermitContextV2(payload: permits),\n                      const SizedBox(height: 22),\n                      const _SectionHeader(\n                        eyebrow: 'MEDIA HISTORY',\n                        title: 'Current and historical imagery',\n                        subtitle: 'Source, date and limitations stay attached so a picture is never mistaken for a verified change by itself.',\n                        icon: Icons.photo_library_outlined,\n                      ),\n                      const SizedBox(height: 10),\n                      BridgePointMediaHistoryV2(payload: mediaBundle),\n                      const SizedBox(height: 22),\n                      const _SectionHeader(\n                        eyebrow: 'PROPERTY STORY',",
              'dossier permit media sections',
          )
          write(path, s)

          # --- Property presentation: plain-language labels and robust media URL selection ---
          path = 'lib/v2/bridgepoint_property_presentation_v2.dart'
          s = read(path)
          s = s.replace("'Canonical identity'", "'What property this is'")
          s = s.replace("_Metric('Canonical confidence'", "_Metric('Match confidence'")
          s = s.replace("title: 'Why Now / verified opportunities'", "title: 'Why BridgePoint thinks this matters now'")
          s = s.replace(
              "'Verified opportunity means BridgePoint’s evidence gate passed. It is still a prioritization/review candidate—not confirmed damage, a guaranteed project, or a guaranteed sale.'",
              "'Plain English: BridgePoint found enough independent evidence to put this property higher on the review list. That still does not prove damage, guarantee a project, or guarantee a sale.'",
          )
          media_url_pattern = re.compile(
              r"  String\? _url\(Map<String, dynamic> item\) \{.*?\n  \}\n\n  Widget _imageCard",
              re.S,
          )
          media_url_replacement = r'''  String? _url(Map<String, dynamic> item) {
    for (final key in const [
      'thumbnail_url',
      'preview_url',
      'image_url',
      'media_url',
      'url',
    ]) {
      var value = _text(item[key], '');
      if (value.isEmpty) continue;
      value = value.replaceAll('{{sizeprefix}}', 'th');
      if (value.startsWith('http://') || value.startsWith('https://')) {
        return value;
      }
    }
    return null;
  }

  Widget _imageCard'''
          s, n = media_url_pattern.subn(media_url_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'presentation media URL: expected 1 match, found {n}')
          write(path, s)

          # --- Navigation: keep all capabilities, stop making every capability a top-level tab ---
          path = 'lib/v2/bridgepoint_app_v2.dart'
          s = read(path)
          anchor = "  List<_AreaV2> get _primary => const [\n        _AreaV2.home,\n        _AreaV2.map,\n        _AreaV2.properties,\n        _AreaV2.investor,\n      ];\n"
          addition = anchor + r'''

  List<_AreaSpecV2> get _railAreas {
    final all = areas;
    final preferred = <_AreaV2>[
      _AreaV2.home,
      _AreaV2.map,
      _AreaV2.properties,
      _AreaV2.opportunities,
      if (!owner) _AreaV2.investor,
      _AreaV2.savedAlerts,
      _AreaV2.operations,
      _AreaV2.products,
      _AreaV2.accountSupport,
      if (owner) _AreaV2.investment,
      if (owner) _AreaV2.buildings,
      if (owner) _AreaV2.owner,
    ];
    final visible = <_AreaSpecV2>[];
    for (final target in preferred) {
      for (final spec in all) {
        if (spec.area == target) {
          visible.add(spec);
          break;
        }
      }
    }
    if (!visible.any((spec) => spec.area == selected)) {
      for (final spec in all) {
        if (spec.area == selected) {
          visible.add(spec);
          break;
        }
      }
    }
    return visible;
  }
'''
          s = replace_once(s, anchor, addition, 'rail areas')
          s = replace_once(s, '    final specs = areas;\n', '    final specs = _railAreas;\n', 'desktop rail source')
          notif = "                      IconButton(\n                        tooltip: 'Notifications and saved alerts',"
          all_tools = "                      IconButton(\n                        tooltip: 'All BridgePoint tools',\n                        onPressed: _showMore,\n                        icon: const Icon(Icons.apps_rounded),\n                      ),\n"
          occurrences = s.count(notif)
          if occurrences < 1:
              raise SystemExit('navigation notifications anchor missing')
          s = s.replace(notif, all_tools + notif)
          write(path, s)

          # --- Home: live national counts + visible evaluation/scoring progress ---
          path = 'lib/v2/bridgepoint_home_live_v2.dart'
          s = read(path)
          s = replace_once(s, "Timer.periodic(const Duration(minutes: 2)", "Timer.periodic(const Duration(seconds: 30)", 'home refresh cadence')
          s = replace_once(
              s,
              "        _safe('bridgepoint_daily_brief_v74'),\n      ]);",
              "        _safe('bridgepoint_daily_brief_v74'),\n        _safe('bridgepoint_flutter_map_state_status_v838'),\n      ]);",
              'home state status load',
          )
          number_anchor = "  String _number(dynamic value) {\n"
          if number_anchor not in s:
              raise SystemExit('home number helper anchor missing')
          helper = r'''  num _num(dynamic value) {
    if (value is num) return value;
    return num.tryParse('${value ?? ''}'.replaceAll(',', '')) ?? 0;
  }

  String _liveNumber(dynamic value) => value == null ? '—' : _number(value);

'''
          s = s.replace(number_anchor, helper + number_anchor, 1)
          s = replace_once(
              s,
              "        final physical = _map(expansion['physical']);\n        final opportunities = _rows(dashboard);",
              "        final physical = _map(expansion['physical']);\n        final stateStatus = _map(at(5));\n        final stateRows = _rows(stateStatus['states']);\n        final ctRows = stateRows.where((row) => '${row['state_code'] ?? ''}' == 'CT').toList();\n        final ct = ctRows.isEmpty ? const <String, dynamic>{} : ctRows.first;\n        final statesWithProperties = stateRows.where((row) => _num(row['canonical_property_count']) > 0).length;\n        final liveStates = stateRows.where((row) => '${row['build_status'] ?? ''}'.toUpperCase() == 'LIVE').length;\n        final opportunities = _rows(dashboard);",
              'home state unpack',
          )
          s = s.replace("_number(coverage['active_properties'] ?? 41150737)", "_liveNumber(coverage['active_properties'])")
          s = s.replace("'CT PROPERTIES', '1,282,833', 'Connecticut parcel / CAMA foundation'", "'CT PROPERTIES', _liveNumber(ct['canonical_property_count']), '${ct['verified_capabilities'] ?? '—'}/${ct['required_capabilities'] ?? '—'} verified capability groups • ${ct['build_status'] ?? 'BUILDING'}'")
          s = s.replace("_number(sourceSummary['registered'] ?? 248)", "_liveNumber(sourceSummary['registered'])")
          s = s.replace("_HomeCardData('US JURISDICTIONS', _number(us['jurisdictions']), '${_number(us['live'])} live • ${_number(us['working'])} working'", "_HomeCardData('US STATES BUILDING', '${stateRows.length}', '$statesWithProperties with property foundations • $liveStates fully live'")
          s = s.replace("'AUTO REFRESH • 2 MIN'", "'AUTO REFRESH • 30 SEC'")

          progress_anchor = "          const SizedBox(height: 14),\n          LayoutBuilder(builder: (context, c) {\n            final stacked = c.maxWidth < 900;"
          progress_insert = r'''          const SizedBox(height: 14),
          _LiveBuildProgressV3(
            activeProperties: _num(coverage['active_properties']),
            evaluatedProperties: _num(coverage['evaluation_receipts']),
            scoredProperties: _num(coverage['scored']),
            statesWithProperties: statesWithProperties,
            totalStates: stateRows.length,
            liveStates: liveStates,
          ),
          const SizedBox(height: 14),
          LayoutBuilder(builder: (context, c) {
            final stacked = c.maxWidth < 900;'''
          s = replace_once(s, progress_anchor, progress_insert, 'home live progress insertion')
          s += r'''

class _LiveBuildProgressV3 extends StatelessWidget {
  const _LiveBuildProgressV3({
    required this.activeProperties,
    required this.evaluatedProperties,
    required this.scoredProperties,
    required this.statesWithProperties,
    required this.totalStates,
    required this.liveStates,
  });

  final num activeProperties;
  final num evaluatedProperties;
  final num scoredProperties;
  final int statesWithProperties;
  final int totalStates;
  final int liveStates;

  static const _cyan = Color(0xFF48E1FF);
  static const _green = Color(0xFF45E6A6);
  static const _blue = Color(0xFF6C83FF);
  static const _muted = Color(0xFFB5C6D9);

  double _ratio(num value, num total) => total <= 0 ? 0 : (value / total).clamp(0, 1).toDouble();

  String _compact(num value) {
    if (value >= 1000000) return '${(value / 1000000).toStringAsFixed(value >= 10000000 ? 1 : 2)}M';
    if (value >= 1000) return '${(value / 1000).toStringAsFixed(value >= 100000 ? 0 : 1)}K';
    return value.toStringAsFixed(0);
  }

  Widget _line(String label, num current, num total, Color color) {
    final ratio = _ratio(current, total);
    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        Row(
          children: [
            Expanded(child: Text(label, style: const TextStyle(fontWeight: FontWeight.w800))),
            Text('${_compact(current)} / ${_compact(total)} • ${(ratio * 100).toStringAsFixed(1)}%', style: TextStyle(color: color, fontWeight: FontWeight.w900)),
          ],
        ),
        const SizedBox(height: 6),
        ClipRRect(
          borderRadius: BorderRadius.circular(999),
          child: LinearProgressIndicator(
            value: ratio,
            minHeight: 8,
            backgroundColor: Colors.white.withValues(alpha: .06),
            color: color,
          ),
        ),
      ],
    );
  }

  @override
  Widget build(BuildContext context) => Card(
        child: Padding(
          padding: const EdgeInsets.all(16),
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              const Row(
                children: [
                  Icon(Icons.sync_rounded, color: _green),
                  SizedBox(width: 8),
                  Expanded(child: Text('Live BridgePoint build progress', style: TextStyle(fontSize: 17, fontWeight: FontWeight.w900))),
                  Chip(label: Text('REFRESHES EVERY 30 SEC')),
                ],
              ),
              const SizedBox(height: 5),
              const Text(
                'These are backend counts, not decorative demo numbers. As ingestion, matching and scoring advance, the counts and bars move with the database.',
                style: TextStyle(color: _muted, fontSize: 12.5, height: 1.4),
              ),
              const SizedBox(height: 14),
              Wrap(
                spacing: 8,
                runSpacing: 8,
                children: [
                  Chip(avatar: const Icon(Icons.home_work_outlined, size: 17), label: Text('${_compact(activeProperties)} property foundations')),
                  Chip(avatar: const Icon(Icons.public_rounded, size: 17), label: Text('$statesWithProperties/$totalStates states with property data')),
                  Chip(avatar: const Icon(Icons.verified_rounded, size: 17), label: Text('$liveStates fully live')),
                ],
              ),
              const SizedBox(height: 14),
              _line('Properties evaluated by the intelligence engine', evaluatedProperties, activeProperties, _cyan),
              const SizedBox(height: 13),
              _line('Properties with current scoring output', scoredProperties, activeProperties, _blue),
            ],
          ),
        ),
      );
}
'''
          write(path, s)

          # --- Weather: stable latest NOAA radar is the default; time animation is optional ---
          path = 'lib/v2/bridgepoint_map_weather_v2.dart'
          s = read(path)
          s = replace_once(s, '  static const _radarMaxHonestZoom = 10.5;\n', '  static const _radarMaxHonestZoom = 11.7;\n', 'radar zoom')
          s = replace_once(s, '  bool playing = true;\n', '  bool playing = true;\n  bool radarHistory = false;\n', 'radar history state')
          s = replace_once(s, 'if (mounted && radar && playing && _radarFrames.length > 1)', 'if (mounted && radar && radarHistory && playing && _radarFrames.length > 1)', 'radar timer guard')
          s = replace_once(
              s,
              "            _filter('NOAA radar', radar, (v) => setState(() => radar = v)),",
              "            _filter('NOAA radar', radar, (v) => setState(() => radar = v)),\n            _filter(\n              'Radar history',\n              radarHistory,\n              (v) => setState(() {\n                radarHistory = v && _radarFramesLive;\n                if (!radarHistory) playing = false;\n              }),\n            ),",
              'radar history filter',
          )
          s = replace_once(
              s,
              "            ActionChip(\n              label: Text(playing ? 'Pause weather' : 'Play weather'),\n              onPressed: () => setState(() => playing = !playing),\n            ),",
              "            if (radarHistory)\n              ActionChip(\n                label: Text(playing ? 'Pause weather' : 'Play weather'),\n                onPressed: () => setState(() => playing = !playing),\n              ),",
              'radar play control',
          )
          s = replace_once(
              s,
              "                        key: ValueKey(_radarFrames.isEmpty\n                            ? 'bp-radar-live'\n                            : 'bp-radar-${_radarTime.millisecondsSinceEpoch}'),\n                        wmsOptions: WMSTileLayerOptions(\n                          baseUrl: 'https://mapservices.weather.noaa.gov/eventdriven/services/radar/radar_base_reflectivity_time/ImageServer/WMSServer?',\n                          layers: const ['0'],\n                          format: 'image/png',\n                          transparent: true,\n                          version: '1.3.0',\n                          otherParameters: _radarFrames.isEmpty\n                              ? const <String, String>{}\n                              : {'TIME': _radarTime.toUtc().toIso8601String()},\n                        ),",
              "                        key: ValueKey(radarHistory && _radarFrames.isNotEmpty\n                            ? 'bp-radar-history-${_radarTime.millisecondsSinceEpoch}'\n                            : 'bp-radar-latest'),\n                        wmsOptions: WMSTileLayerOptions(\n                          baseUrl: radarHistory\n                              ? 'https://mapservices.weather.noaa.gov/eventdriven/services/radar/radar_base_reflectivity_time/ImageServer/WMSServer?'\n                              : 'https://mapservices.weather.noaa.gov/eventdriven/services/radar/radar_base_reflectivity/MapServer/WMSServer?',\n                          layers: const ['0'],\n                          format: 'image/png',\n                          transparent: true,\n                          version: '1.3.0',\n                          otherParameters: radarHistory && _radarFrames.isNotEmpty\n                              ? {'TIME': _radarTime.toUtc().toIso8601String()}\n                              : const <String, String>{},\n                        ),",
              'radar WMS layer',
          )
          s = replace_once(
              s,
              "                              _radarFramesLive\n                                  ? 'NOAA MRMS • ${_radarFrames.length} FRAMES'\n                                  : 'NOAA MRMS • LIVE',",
              "                              radarHistory && _radarFramesLive\n                                  ? 'NOAA MRMS • ${_radarFrames.length} HISTORY FRAMES'\n                                  : 'NOAA MRMS • LIVE LATEST',",
              'radar status label',
          )
          s = replace_once(
              s,
              "                              child: _radarFrames.length > 1\n                                  ? Slider(",
              "                              child: radarHistory && _radarFrames.length > 1\n                                  ? Slider(",
              'radar slider guard',
          )
          s = replace_once(
              s,
              "                              _radarFrames.isEmpty ? 'LATEST' : _clock(_radarTime),",
              "                              radarHistory && _radarFrames.isNotEmpty ? _clock(_radarTime) : 'LATEST',",
              'radar clock label',
          )
          write(path, s)

          # --- Motion background: restore a recognizable animated DNA/helix motif ---
          path = 'lib/v2/bridgepoint_chrome_v2.dart'
          s = read(path)
          dna_anchor = "    final phase = progress * math.pi * 2;\n    final points = <Offset>[];"
          dna_block = r'''    final phase = progress * math.pi * 2;

    // A subtle animated double helix makes the product feel alive without
    // replacing the data-network motif underneath it.
    for (final side in const [.13, .87]) {
      final centerX = size.width * side;
      final amplitude = math.min(size.width * .045, 46.0);
      Offset? previousA;
      Offset? previousB;
      for (var i = 0; i <= 52; i++) {
        final t = i / 52.0;
        final y = t * size.height;
        final wave = math.sin(t * math.pi * 8 + phase + side * math.pi);
        final xA = centerX + wave * amplitude;
        final xB = centerX - wave * amplitude;
        final a = Offset(xA, y);
        final b = Offset(xB, y);
        if (previousA != null && previousB != null) {
          canvas.drawLine(
            previousA,
            a,
            Paint()
              ..strokeWidth = 1.15
              ..color = const Color(0xFF48E1FF).withValues(alpha: .085),
          );
          canvas.drawLine(
            previousB,
            b,
            Paint()
              ..strokeWidth = 1.15
              ..color = const Color(0xFF6C83FF).withValues(alpha: .075),
          );
        }
        if (i % 4 == 0) {
          canvas.drawLine(
            a,
            b,
            Paint()
              ..strokeWidth = .8
              ..color = const Color(0xFFB9F6FF).withValues(alpha: .055),
          );
          canvas.drawCircle(
            a,
            2.2,
            Paint()..color = const Color(0xFF48E1FF).withValues(alpha: .20),
          );
          canvas.drawCircle(
            b,
            2.2,
            Paint()..color = const Color(0xFF6C83FF).withValues(alpha: .18),
          );
        }
        previousA = a;
        previousB = b;
      }
    }

    final points = <Offset>[];'''
          s = replace_once(s, dna_anchor, dna_block, 'DNA background')
          write(path, s)

          # Trigger the audited productized build after recovery commit lands.
          path = '.github/workflows/productized-v2-release.yml'
          s = read(path)
          s = replace_once(
              s,
              '# productized release trigger v4 - V868 Intelligence Studio capability coverage',
              '# productized release trigger v5 - property dossier, live progress, radar and navigation recovery',
              'productized release trigger bump',
          )
          write(path, s)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format changed Dart
        shell: bash
        run: |
          dart format \
            lib/v2/bridgepoint_property_dossier_v2.dart \
            lib/v2/bridgepoint_property_presentation_v2.dart \
            lib/v2/bridgepoint_app_v2.dart \
            lib/v2/bridgepoint_home_live_v2.dart \
            lib/v2/bridgepoint_map_weather_v2.dart \
            lib/v2/bridgepoint_chrome_v2.dart

      - name: Verify recovery source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "bridgepoint_property_media_bundle_v169" lib/v2/bridgepoint_property_dossier_v2.dart
          grep -q "KartaView\|street-level" lib/v2/bridgepoint_property_dossier_v2.dart
          grep -q "Live BridgePoint build progress" lib/v2/bridgepoint_home_live_v2.dart
          grep -q "radar_base_reflectivity/MapServer/WMSServer" lib/v2/bridgepoint_map_weather_v2.dart
          grep -q "_railAreas" lib/v2/bridgepoint_app_v2.dart
          grep -q "double helix" lib/v2/bridgepoint_chrome_v2.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Commit verified recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/v2/bridgepoint_property_dossier_v2.dart \
            lib/v2/bridgepoint_property_presentation_v2.dart \
            lib/v2/bridgepoint_app_v2.dart \
            lib/v2/bridgepoint_home_live_v2.dart \
            lib/v2/bridgepoint_map_weather_v2.dart \
            lib/v2/bridgepoint_chrome_v2.dart \
            .github/workflows/productized-v2-release.yml
          git commit -m 'Recover show-ready BridgePoint property intelligence V3'
          git push origin HEAD:main
