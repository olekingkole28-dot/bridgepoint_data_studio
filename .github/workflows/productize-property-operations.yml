name: Productize Property and Operations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/productize-property-operations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tool/productize_property_and_operations.py
      - name: Commit product UI wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Product QA'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_properties_v2.dart lib/v2/bridgepoint_investor_v2.dart lib/v2/bridgepoint_operations_workspace_v2.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Replace raw payload screens with product UI'
          git push origin HEAD:main
