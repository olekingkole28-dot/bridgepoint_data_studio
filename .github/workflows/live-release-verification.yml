name: Verify BridgePoint Clean V2 Live Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["BridgePoint Clean V2 Production"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Clean V2 production markers
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ORIGIN="https://bridgepointintelligence.online"
          curl -fsSL --retry 6 --retry-delay 3 -H 'Cache-Control: no-cache' \
            "${ORIGIN}/bridgepoint-v2-release.json?verify=${EXPECTED_SHA:-manual}" \
            -o /tmp/live-v2-release.json
          curl -fsSL --retry 6 --retry-delay 3 -H 'Cache-Control: no-cache' \
            "${ORIGIN}/?verify=${EXPECTED_SHA:-manual}" \
            -o /tmp/live-index.html
          test -s /tmp/live-v2-release.json
          test -s /tmp/live-index.html

      - name: Verify public Clean V2 artifact
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          marker = json.loads(Path('/tmp/live-v2-release.json').read_text(encoding='utf-8'))
          index = Path('/tmp/live-index.html').read_text(encoding='utf-8', errors='ignore')
          expected = os.environ.get('EXPECTED_SHA', '').strip()

          assert marker.get('architecture') == 'clean-v2', marker
          assert marker.get('historical_patch_replay') is False, marker
          assert marker.get('production_candidate') is True, marker
          assert marker.get('version'), marker
          if expected:
              assert marker.get('version') == expected, (marker, expected)
          assert len(index.strip()) > 200, 'Public index.html unexpectedly small'
          assert ('flutter_bootstrap.js' in index or 'main.dart.js' in index), 'Flutter boot marker missing from public index.html'
          assert 'Install BridgePoint' in index, 'Install CTA missing from public Clean V2 host'
          assert 'bp-expansion-launcher' not in index, 'Legacy raw expansion overlay leaked into public host'

          print(json.dumps({
              'verified': True,
              'architecture': marker.get('architecture'),
              'version': marker.get('version'),
              'built_at': marker.get('built_at'),
              'public_origin': 'https://bridgepointintelligence.online/'
          }, indent=2))
          PY
