name: BridgePoint Clean V2

on:
  workflow_dispatch:
  push:
    branches: [bridgepoint-v2-clean]
  pull_request:
    branches: [bridgepoint-v2-clean]

concurrency:
  group: bridgepoint-clean-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean architecture contract
        run: |
          set -euo pipefail
          test -s lib/main_v2.dart
          test -s lib/v2/bridgepoint_app_v2.dart
          test -s lib/v2/bridgepoint_home_v2.dart
          test -s lib/v2/bridgepoint_property_360_v2.dart
          test -s lib/v2/bridgepoint_map_weather_v2.dart
          test -s lib/v2/bridgepoint_operations_workspace_v2.dart
          test -s lib/v2/bridgepoint_portfolio_risk_v2.dart
          test -s lib/v2/bridgepoint_ai_v2.dart
          test -s lib/v2/bridgepoint_products_settings_v2.dart
          test -s lib/v2/bridgepoint_public_landing_v2.dart
          test -s lib/bridgepoint_intelligence_studio_v790.dart
          test -s lib/bridgepoint_integrations_hub_v790.dart
          test -s lib/screens/bridgepoint_owner_command_center.dart
          test -s lib/screens/bridgepoint_owner_v2_requirements_v832.dart
          python - <<'PY'
          from pathlib import Path
          files=[Path('lib/main_v2.dart'),*Path('lib/v2').glob('*.dart'),Path('lib/bridgepoint_intelligence_studio_v790.dart'),Path('lib/bridgepoint_integrations_hub_v790.dart'),*Path('lib/screens').glob('bridgepoint_owner*.dart')]
          source='\n'.join(p.read_text(encoding='utf-8') for p in files if p.exists())
          required=[
            'bridgepoint_daily_brief_v74',
            'bridgepoint_public_system_status_v320',
            'bridgepoint_public_expansion_status_v321',
            'bridgepoint_property_suggestions_v192',
            'bridgepoint_flutter_property_detail_v344',
            'bridgepoint_property_timeline_v78',
            'bridgepoint_property_climate_profile_v510',
            'bridgepoint_digital_twin_summary_v509',
            'bridgepoint_property_media_bundle_v169',
            'bridgepoint_flutter_opportunities_v235',
            'bridgepoint_flutter_signals',
            'bridgepoint_flutter_sources',
            'bridgepoint_flutter_models',
            'bridgepoint_watchlists_v88',
            'bridgepoint_route_plans_v87',
            'bridgepoint_team_workspace_v80',
            'bridgepoint_notifications_v74',
            'bridgepoint_flutter_packages_core_v429',
            'bridgepoint-checkout-v67',
            'bridgepoint_update_display_preferences_v98',
            'bridgepoint_ai_answer_ui_v322',
            'bridgepoint_portfolio_intelligence_v460',
            'bridgepoint_owner_v2_requirements_v832',
            'BridgePointIntelligenceStudio',
            'BridgePointIntegrationsHub',
            'BridgePointOwnerCommandCenter',
            'radar_base_reflectivity_time/ImageServer/WMSServer',
            'NOAA MRMS • ~1 KM SOURCE',
          ]
          missing=[x for x in required if x not in source]
          if missing:
            raise SystemExit('Missing clean V2 contract markers: '+', '.join(missing))
          forbidden=['apply_launch_v95.py','apply_weather_home_community_v145.py','apply_map_viewport_v124.py','repair_owner_expansion_v96.py']
          found=[x for x in forbidden if x in source]
          if found:
            raise SystemExit('Historical patch machinery leaked into clean V2 source: '+', '.join(found))
          print('Clean V2 module graph verified: direct source modules + stable backend contracts; no historical release replay required.')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze clean app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests when present
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests yet."
          fi

      - name: Stamp clean release
        run: |
          printf '{"architecture":"clean-v2","version":"%s","built_at":"%s","backend":"existing-production-supabase","historical_patch_replay":false}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > web/bridgepoint-v2-release.json

      - name: Build clean installable web app
        run: |
          set -euo pipefail
          flutter build web --release -t lib/main_v2.dart --base-href "/" --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
          test -s build/web/index.html
          test -s build/web/main.dart.js || test -s build/web/main.dart.wasm || true
          echo "Clean V2 web build verified locally in the workflow. Artifact upload intentionally omitted because repository Actions storage is currently at quota."
