name: BridgePoint Customer Ready V960

on:
  push:
    branches: [customer-ready-v946, customer-ready-v960-rebased]
    paths:
      - 'lib/main_v2.dart'
      - 'lib/v2/**'
      - 'lib/bridgepoint_intelligence_studio_v790.dart'
      - 'lib/bridgepoint_integrations_hub_v790.dart'
      - 'lib/screens/bridgepoint_owner**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - '.github/scripts/product_release_audit_v852.py'
      - '.github/workflows/customer-ready-v960.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-customer-ready-v960
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify customer-ready source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/main_v2.dart
          test -s lib/v2/bridgepoint_customer_ready_app_v946.dart
          test -s lib/v2/bridgepoint_home_v2.dart
          test -s lib/v2/bridgepoint_map_weather_v2.dart
          test -s lib/v2/bridgepoint_property_360_v2.dart
          test -s lib/v2/bridgepoint_buildings_v2.dart
          test -s lib/v2/bridgepoint_products_settings_v2.dart
          python - <<'PY'
          from pathlib import Path
          app=Path('lib/v2/bridgepoint_customer_ready_app_v946.dart').read_text(encoding='utf-8')
          home=Path('lib/v2/bridgepoint_home_v2.dart').read_text(encoding='utf-8')
          mp=Path('lib/v2/bridgepoint_map_weather_v2.dart').read_text(encoding='utf-8')
          prop=Path('lib/v2/bridgepoint_property_360_v2.dart').read_text(encoding='utf-8')
          buildings=Path('lib/v2/bridgepoint_buildings_v2.dart').read_text(encoding='utf-8')
          plans=Path('lib/v2/bridgepoint_products_settings_v2.dart').read_text(encoding='utf-8')
          required={
            'packages_visible': "label: 'Packages'" in app,
            'packages_area': '_CustomerArea.plans' in app,
            'radar_paused_default': 'bool playing = false;' in mp,
            'radar_manual_rate': 'Duration(milliseconds: 5500)' in mp,
            'radar_not_zoom_hidden': 'bool get _showRadar => radar;' in mp,
            'roof_icon': 'Icons.roofing_rounded' in mp,
            'storm_icon': 'Icons.thunderstorm_rounded' in mp,
            'fire_icon': 'Icons.local_fire_department_rounded' in mp,
            'solar_icon': 'Icons.solar_power_rounded' in mp,
            'marker_explanations': 'GestureDetector' in mp and ('What am I seeing' in mp or 'what it is' in mp.lower()),
            'timeline': 'bridgepoint_property_timeline_v857' in prop,
            'building_state_search': 'bridgepoint_flutter_properties_state_browse_v840' in buildings,
            'access_contract': 'bridgepoint_customer_access_contract_v318' in plans,
            'home_live_pulse': 'bridgepoint_public_system_pulse_v957' in home and 'Duration(seconds: 5)' in home,
            'owner_live_activity': 'bridgepoint_owner_live_activity_v958' in home,
          }
          missing=[k for k,v in required.items() if not v]
          if missing: raise SystemExit('Customer-ready contract missing: '+', '.join(missing))
          print('Customer-ready V960 source contract verified.')
          PY

      - name: Deep product regression audit
        run: python .github/scripts/product_release_audit_v852.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release -t lib/main_v2.dart --base-href '/app/' --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
          grep -q '<base href="/app/">' build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          cat > build/web/bridgepoint-v2-release.json <<EOF
          {"architecture":"customer-ready-v2","version":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","primary_navigation":["Home","Map","Opportunities","Work","Packages"],"radar_mode":"latest-paused-manual-animation","radar_frame_ms":5500,"radar_visible_at_property_zoom":true,"map_markers_explainable":true,"property_timeline_explainable":true,"package_access_contract":"v318","customer_plan_contract":"v944","property_search_contract":"v959","public_system_pulse":"v957","owner_activity_contract":"v958"}
          EOF
          touch build/web/.nojekyll

      - name: Package compiled web artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-customer-ready-v960-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Build private handoff branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v960-handoff /tmp/v960-build.tar.gz
          mkdir -p /tmp/v960-handoff
          tar -C build/web -czf /tmp/v960-build.tar.gz .
          base64 -w0 /tmp/v960-build.tar.gz > /tmp/v960-build.tar.gz.b64
          split -b 400000 -d -a 3 /tmp/v960-build.tar.gz.b64 /tmp/v960-handoff/chunk-
          SHA256="$(sha256sum /tmp/v960-build.tar.gz | awk '{print $1}')"
          BYTES="$(stat -c '%s' /tmp/v960-build.tar.gz)"
          CHUNKS="$(find /tmp/v960-handoff -type f -name 'chunk-*' | wc -l)"
          cat > /tmp/v960-handoff/manifest.json <<EOF
          {"architecture":"customer-ready-v2","source_sha":"${GITHUB_SHA}","source_run":${GITHUB_RUN_ID},"archive_sha256":"${SHA256}","archive_bytes":${BYTES},"chunk_count":${CHUNKS},"chunk_encoding":"base64","chunk_size":400000,"primary_navigation":["Home","Map","Opportunities","Work","Packages"],"radar_mode":"latest-paused-manual-animation","radar_frame_ms":5500}
          EOF

      - name: Publish private compiled handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v960-handoff
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b customer-ready-v960-handoff
          git add -A
          git commit -m "Customer-ready V960 handoff ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin customer-ready-v960-handoff
