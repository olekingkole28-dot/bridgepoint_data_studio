# Home visual finish trigger v1
name: BridgePoint Home Visual Finish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-visual-finish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tool/home_visual_finish.py
      - name: Commit Home finish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Visual QA'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_home_live_v2.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finish Home visual hierarchy and readability'
          git push origin HEAD:main
