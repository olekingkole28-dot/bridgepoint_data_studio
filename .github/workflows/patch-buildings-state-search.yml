name: Patch Buildings State Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-buildings-state-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce selected state in Buildings search
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/v2/bridgepoint_buildings_v2.dart')
          s=p.read_text()
          old="""      final raw = await Supabase.instance.client.rpc(
        'bridgepoint_property_suggestions_v192',
        params: {'p_query': q, 'p_limit': 20},
      );
      final rows = _rows(raw).where((row) {
        final state = '${row['state_code'] ?? ''}'.toUpperCase();
        return state.isEmpty || state == _state;
      }).take(12).toList();
      if (mounted) setState(() => _results = rows);"""
          new="""      final raw = await Supabase.instance.client.rpc(
        'bridgepoint_flutter_properties_state_browse_v840',
        params: {
          'p_state_code': _state,
          'p_search': q,
          'p_municipality': null,
          'p_property_type': null,
          'p_limit': 12,
          'p_offset': 0,
        },
      );
      final rows = _rows(raw is Map ? raw['properties'] : raw);
      if (mounted) setState(() => _results = rows);"""
          if old not in s:
              raise SystemExit('expected Buildings search block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_buildings_v2.dart
          git diff --cached --check
          git commit -m 'Enforce selected state in Buildings model search'
          git push origin HEAD:main
