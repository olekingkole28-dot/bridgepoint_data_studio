name: Repair v319 partial patch conflicts

on:
  push:
    branches: [mobile-v325-release-compat]
    paths:
      - '.github/workflows/v319-partial-patch-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v325-release-compat
          fetch-depth: 0
      - name: Let safe v319 hunks merge and structurally repair expected conflicts
        shell: python
        run: |
          from pathlib import Path
          p=Path('tool/apply_owner_patterns_radar_v319.py')
          s=p.read_text()
          old="subprocess.run(['patch','--batch','--forward','--reject-file=-','-p0'],input=patch,check=True)"
          new="""result=subprocess.run(['patch','--batch','--forward','--reject-file=-','-p0'],input=patch,check=False)\nif result.returncode not in (0,1):\n    raise SystemExit(f'v319 patch command failed unexpectedly with exit {result.returncode}')\nsubprocess.run(['python','tool/repair_v319_responsive_generated.py'],check=True)"""
          if old not in s:
              raise SystemExit('v319 patch invocation not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/v319-partial-patch-repair.yml').unlink()
      - name: Commit repair
        run: |
          git config user.name 'BridgePoint Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Repair v319 conflicts structurally on responsive source'
          git push origin HEAD:mobile-v325-release-compat
