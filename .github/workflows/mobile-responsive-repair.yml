name: BridgePoint mobile responsive repair

on:
  push:
    paths:
      - '.github/workflows/mobile-responsive-repair.yml'

permissions:
  contents: write

jobs:
  repair-responsive-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and finish responsive source pass
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/main.dart')
          src = path.read_text()

          # Repair two filter-row closings from the first responsive pass.
          bad_signal = """                        Text(\n                          'Newest signals first',\n                          style: TextStyle(\n                            color: Colors.white.withOpacity(0.38),\n                            fontSize: 9,\n                          ),\n                        )),"""
          good_signal = """                        Text(\n                          'Newest signals first',\n                          style: TextStyle(\n                            color: Colors.white.withOpacity(0.38),\n                            fontSize: 9,\n                          ),\n                        ),"""
          if bad_signal not in src:
              raise SystemExit('Expected signal filter repair target was not found')
          src = src.replace(bad_signal, good_signal, 1)

          bad_property = """                        Flexible(child: Text(\n                          'Search narrows properties before intelligence joins',\n                          style: TextStyle(\n                            color: Colors.white.withOpacity(0.38),\n                            fontSize: 9,\n                          ),\n                        ),"""
          good_property = """                        Flexible(\n                          child: Text(\n                            'Search narrows properties before intelligence joins',\n                            style: TextStyle(\n                              color: Colors.white.withOpacity(0.38),\n                              fontSize: 9,\n                            ),\n                          ),\n                        ),"""
          if bad_property not in src:
              raise SystemExit('Expected property filter repair target was not found')
          src = src.replace(bad_property, good_property, 1)

          # Shared section titles must be allowed to use the card width on phones.
          old_settings_title = """            Row(children: [\n              Icon(icon, color: AppTheme.cyan, size: 21),\n              const SizedBox(width: 9),\n              Text(title, style: const TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.w800)),\n            ]),"""
          new_settings_title = """            Row(crossAxisAlignment: CrossAxisAlignment.start, children: [\n              Icon(icon, color: AppTheme.cyan, size: 21),\n              const SizedBox(width: 9),\n              Expanded(\n                child: Text(\n                  title,\n                  style: const TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.w800),\n                ),\n              ),\n            ]),"""
          if old_settings_title in src:
              src = src.replace(old_settings_title, new_settings_title, 1)

          start = src.index('class _PanelHeader extends StatelessWidget {')
          end = src.index('class _ModelProgress extends StatelessWidget {', start)
          panel = r'''class _PanelHeader extends StatelessWidget {
            const _PanelHeader({
              required this.title,
              required this.subtitle,
              required this.action,
            });

            final String title;
            final String subtitle;
            final String action;

            @override
            Widget build(BuildContext context) {
              return LayoutBuilder(
                builder: (context, constraints) {
                  final compact = constraints.maxWidth < 460;
                  final copy = Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        title,
                        style: const TextStyle(
                          color: Colors.white,
                          fontSize: 16,
                          fontWeight: FontWeight.w800,
                        ),
                      ),
                      const SizedBox(height: 4),
                      Text(
                        subtitle,
                        style: const TextStyle(
                          color: AppTheme.textMuted,
                          fontSize: 11,
                          height: 1.35,
                        ),
                      ),
                    ],
                  );
                  final actionButton = TextButton(
                    onPressed: () => _showInfoDialog(
                      context,
                      title,
                      '$subtitle\n\nOpen the rows or cards below for property-level detail, supporting evidence, timing, confidence, sources, and suggested next steps.',
                    ),
                    child: Text(action),
                  );

                  if (compact) {
                    return Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        copy,
                        const SizedBox(height: 4),
                        Align(alignment: Alignment.centerLeft, child: actionButton),
                      ],
                    );
                  }
                  return Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Expanded(child: copy),
                      const SizedBox(width: 10),
                      actionButton,
                    ],
                  );
                },
              );
            }
          }

          '''
          src = src[:start] + panel + src[end:]

          # Never advertise a full-system customer package. Full platform remains owner-only.
          src = src.replace("'all':'All Intelligence'", "'all':'BridgePoint Intelligence Suite'", 1)
          src = src.replace("??'All Intelligence';", "??'BridgePoint Intelligence Suite';", 1)
          src = src.replace("subtitle: 'Every new account receives BridgePoint All Intelligence.'", "subtitle: 'New accounts start in a scoped BridgePoint trial workspace.'", 1)
          src = src.replace("answer:'Yes. BridgePoint V81 uses negative scoring. Missing direct matches, missing corroboration, weak source diversity, older evidence, and lower confidence subtract visible points. All Intelligence also keeps only the best qualifying opportunity per property, so the lead list stays finite and useful.'", "answer:'Yes. BridgePoint V81 uses negative scoring. Missing direct matches, missing corroboration, weak source diversity, older evidence, and lower confidence subtract visible points. The intelligence suite also keeps only the best qualifying opportunity per property, so the lead list stays finite and useful.'", 1)

          # Settings metric grids must use one full-width card on narrow phones.
          src = src.replace('final columns = constraints.maxWidth >=900 ?4:2;', 'final columns = constraints.maxWidth >= 1000 ? 4 : constraints.maxWidth >= 620 ? 2 : 1;', 1)

          path.write_text(src)
          Path('.github/workflows/mobile-responsive-repair.yml').unlink()

      - name: Validate transformed Dart structure
        shell: python
        run: |
          from pathlib import Path
          s = Path('lib/main.dart').read_text()
          must_have = [
              'final compact = constraints.maxWidth < 680;',
              'final compact = constraints.maxWidth < 460;',
              'Widget _packageSelector()',
              'New accounts start in a scoped BridgePoint trial workspace.',
          ]
          missing = [x for x in must_have if x not in s]
          if missing:
              raise SystemExit(f'Missing expected fixes: {missing}')
          if 'Newest signals first' not in s or 'Search narrows properties before intelligence joins' not in s:
              raise SystemExit('Filter labels disappeared unexpectedly')
          if s.count('{') != s.count('}'):
              raise SystemExit('Unbalanced braces')
          if s.count('(') != s.count(')'):
              raise SystemExit('Unbalanced parentheses')
          if s.count('[') != s.count(']'):
              raise SystemExit('Unbalanced brackets')

      - name: Commit repair
        run: |
          git config user.name "BridgePoint Automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart .github/workflows/mobile-responsive-repair.yml
          git commit -m "Repair and finish mobile responsive layouts"
          git push origin HEAD:main
