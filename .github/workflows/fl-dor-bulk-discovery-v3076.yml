name: Florida DOR 2026 Bulk Parcel Discovery v3076
on:
  push:
    paths:
      - "scripts/discover_fl_dor_bulk_v3076.py"
      - ".github/workflows/fl-dor-bulk-discovery-v3076.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover official Florida DOR 2026 bulk parcel files
        run: python scripts/discover_fl_dor_bulk_v3076.py
      - name: Commit discovered file ledger
        run: |
          if git diff --quiet -- ops/fl-dor-bulk-files-v3076.json; then
            echo "No ledger change"
            exit 0
          fi
          git config user.name "bridgepoint-automation"
          git config user.email "actions@users.noreply.github.com"
          git add ops/fl-dor-bulk-files-v3076.json
          git commit -m "ops: refresh Florida DOR 2026 bulk parcel ledger"
          git push
