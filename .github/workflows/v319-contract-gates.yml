name: Repair v319 feature contract gates

on:
  push:
    branches: [mobile-v325-release-compat]
    paths:
      - '.github/workflows/v319-contract-gates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v325-release-compat
          fetch-depth: 0
      - name: Replace v319 brittle SHA gates with contracts
        shell: python
        run: |
          from pathlib import Path
          p=Path('tool/apply_owner_patterns_radar_v319.py')
          s=p.read_text()
          old_pre="""actual=hashlib.sha256(path.read_bytes()).hexdigest()\nif actual!=expected_pre:\n    raise SystemExit(f'v319 baseline mismatch: expected {expected_pre}, got {actual}')\n"""
          new_pre="""actual=hashlib.sha256(path.read_bytes()).hexdigest()\nif actual!=expected_pre:\n    pre_body=path.read_text(encoding='utf-8')\n    required_pre=[\n        'bridgepoint_customer_access_contract_v318',\n        '_RadarIntensityLegendV318',\n        '_availablePackagesV318',\n        'bridgepoint-v316-manual-social-only',\n    ]\n    missing_pre=[m for m in required_pre if m not in pre_body]\n    if missing_pre:\n        raise SystemExit(f'v319 baseline contract mismatch: hash {actual}; missing {missing_pre}')\n    print(f'v319 accepted evolved v318 baseline {actual} via feature contract')\n"""
          if old_pre not in s:
              raise SystemExit('v319 input SHA guard not found')
          s=s.replace(old_pre,new_pre,1)
          old_post="""actual=hashlib.sha256(path.read_bytes()).hexdigest()\nif actual!=expected_post:\n    raise SystemExit(f'v319 output mismatch: expected {expected_post}, got {actual}')\nbody=path.read_text(encoding='utf-8')\n"""
          new_post="""actual=hashlib.sha256(path.read_bytes()).hexdigest()\nbody=path.read_text(encoding='utf-8')\nif actual!=expected_post:\n    required_post=[\n        'bridgepoint_owner_pattern_intelligence_v319',\n        'Kole + Taylor owner view',\n        'Top patterns across BridgePoint',\n        'bridgepoint-v319-owner-pattern-intelligence + iso-wms-preloaded-radar + municipal-permit-live',\n        \"'TIME':radarFrames[i].toUtc().toIso8601String()\",\n        'weather-center-radar-preloaded',\n        'bp-us-radar-preloaded',\n    ]\n    missing_post=[m for m in required_post if m not in body]\n    if missing_post:\n        raise SystemExit(f'v319 output contract mismatch: hash {actual}; missing {missing_post}')\n    print(f'v319 accepted evolved output {actual} via feature contract')\n"""
          if old_post not in s:
              raise SystemExit('v319 output SHA guard not found')
          s=s.replace(old_post,new_post,1)
          p.write_text(s)
          Path('.github/workflows/v319-contract-gates.yml').unlink()
      - name: Commit repair
        run: |
          git config user.name 'BridgePoint Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Verify v319 by feature contracts'
          git push origin HEAD:mobile-v325-release-compat
