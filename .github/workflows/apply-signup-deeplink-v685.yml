name: Apply Signup + Release Guard Repairs V688

on:
  push:
    branches: [main]
    paths:
      - tool/apply_signup_deeplink_v685.py
      - tool/repair_v321_validator_marker_v688.py
      - .github/workflows/apply-signup-deeplink-v685.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-apply-signup-release-repairs-v688
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply canonical signup deep link repair
        run: |
          set -euo pipefail
          python tool/apply_signup_deeplink_v685.py
          grep -q 'bridgepoint-v685-signup-deeplink' lib/main.dart
          grep -q "Uri.base.queryParameters\['mode'\]" lib/main.dart
      - name: Apply evolved V321 validator repair
        run: |
          set -euo pipefail
          python tool/repair_v321_validator_marker_v688.py
      - name: Persist source and validator repairs
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/main.dart tool/apply_resilience_expansion_radar_v321.py
          if git diff --cached --quiet; then
            echo 'V685/V688 repairs already current.'
          else
            git commit -m 'Persist signup deep link and evolved release guards V688'
            git push origin HEAD:main
          fi
