          before_map=t[:t.find('  Map<String, dynamic> _map')]
          if 'void initState()' not in before_map:
              if init_property not in t: raise SystemExit('Property360 init marker missing')
              t=t.replace(init_property,init_property_new)
          prop.write_text(t)
          PY
          git diff --check
      - name: Commit restored workspace controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_app_v2.dart lib/v2/bridgepoint_property_360_v2.dart
          if git diff --cached --quiet; then
            echo 'Opportunities and quick controls already restored.'
            exit 0
          fi
          git commit -m 'Restore Opportunities and global property quick controls'
          git push origin HEAD:main
