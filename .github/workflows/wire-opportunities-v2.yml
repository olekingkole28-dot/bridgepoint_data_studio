          if 'final String? initialQuery;' not in t:
              if constructor not in t: raise SystemExit('Property360 constructor marker missing')
              t=t.replace(constructor,constructor_new)
          init_property="""  static const _amber = Color(0xFFFFC857);

  @override
  void dispose() {
