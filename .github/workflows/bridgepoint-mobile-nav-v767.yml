name: BridgePoint UI Repair v790

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-ui-repair-v790
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic UI repairs
        run: |
          python -m py_compile tool/apply_package_truth_v778.py
          python -m py_compile tool/apply_enterprise_studio_v790.py
          python tool/apply_package_truth_v778.py
          python tool/apply_enterprise_studio_v790.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.changes.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        if: steps.changes.outputs.changed == 'true'
        run: |
          flutter pub get
          dart format lib/main.dart lib/bridgepoint_intelligence_studio_v790.dart lib/bridgepoint_integrations_hub_v790.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit verified repairs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "bridgepoint-automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart lib/bridgepoint_intelligence_studio_v790.dart lib/bridgepoint_integrations_hub_v790.dart
          git commit -m "Apply verified BridgePoint enterprise UI v790"
          git push origin HEAD:main
