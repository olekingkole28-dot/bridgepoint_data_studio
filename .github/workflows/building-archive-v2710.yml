name: Building Archive v2710
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/building-archive-v2710.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: bridgepoint-building-archive-v2710
  cancel-in-progress: true
env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co
  SUPABASE_KEY: sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25
jobs:
  build:
    name: ${{ matrix.state }} ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: [DC]
        kind: [building, building_part]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb==1.4.1 requests==2.32.5
      - name: Verify renewable GitHub OIDC endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - run: python scripts/build_building_archive_v2710.py --state '${{ matrix.state }}' --kind '${{ matrix.kind }}'
