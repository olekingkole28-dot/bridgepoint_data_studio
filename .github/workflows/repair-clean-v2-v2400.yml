name: Repair Clean V2 for World V2400
on:
  push:
    branches: [bridgepoint-world-v2400]
    paths:
      - 'scripts/repair_clean_v2_v2400.py'
      - '.github/workflows/repair-clean-v2-v2400.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridgepoint-world-v2400
          fetch-depth: 1
      - name: Apply exact compiler repairs
        run: python3 scripts/repair_clean_v2_v2400.py
      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Build Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_products_settings_v2.dart lib/v2/bridgepoint_app_v2.dart lib/v2/bridgepoint_map_weather_v2.dart lib/v2/bridgepoint_public_landing_v2.dart
          if git diff --cached --quiet; then
            echo 'No repairs were necessary.'
            exit 0
          fi
          git commit -m 'Fix Clean V2 compiler blockers for World V2400'
          git push origin HEAD:bridgepoint-world-v2400
