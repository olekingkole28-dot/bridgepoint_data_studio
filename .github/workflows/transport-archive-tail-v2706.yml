name: Transport Archive Tail v2706

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transport-archive-tail-v2706.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridgepoint-transport-archive-tail-v2706
  cancel-in-progress: false

env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co
  SUPABASE_KEY: sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25

jobs:
  tail-transport:
    name: ${{ matrix.state }} ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        state: [DE, SD, ND, AK, VT, WY, GU, VI, AS, MP]
        kind: [segment, connector]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned archive dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1 requests==2.32.5
      - name: Verify renewable GitHub OIDC endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Build, validate, upload, and verify exact transport archive
        run: python scripts/build_transport_archive_v2696.py --state '${{ matrix.state }}' --kind '${{ matrix.kind }}'
