name: BridgePoint V3 Production Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/main_v2.dart'
      - 'lib/v2/bridgepoint_app_v2.dart'
      - 'lib/v2/bridgepoint_home_v2.dart'
      - 'lib/v2/bridgepoint_map_weather_v2.dart'
      - 'lib/v2/bridgepoint_products_settings_v2.dart'
      - 'lib/v2/bridgepoint_chrome_v2.dart'
      - 'lib/v3/**'
      - 'lib/screens/bridgepoint_owner**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - '.github/workflows/flutter-web-v3-production.yml'

permissions:
  contents: write

concurrency:
  group: bridgepoint-v3-production-build
  cancel-in-progress: true

jobs:
  build-release-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify V3 source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/main_v2.dart
          test -s lib/v3/bridgepoint_app_v3.dart
          test -s lib/v3/bridgepoint_home_v3.dart
          test -s lib/v3/bridgepoint_map_weather_v3.dart
          test -s lib/v3/bridgepoint_plans_v3.dart
          test -s assets/brand/bridgepoint-mark-v80.svg
          grep -q "export '../v3/bridgepoint_app_v3.dart'" lib/v2/bridgepoint_app_v2.dart
          grep -q "export '../v3/bridgepoint_home_v3.dart'" lib/v2/bridgepoint_home_v2.dart
          grep -q "export '../v3/bridgepoint_map_weather_v3.dart'" lib/v2/bridgepoint_map_weather_v2.dart
          grep -q "export '../v3/bridgepoint_plans_v3.dart'" lib/v2/bridgepoint_products_settings_v2.dart
          grep -q "static const primary = <_Area>\[_Area.home, _Area.map, _Area.properties, _Area.work\]" lib/v3/bridgepoint_app_v3.dart
          grep -q "label: 'Plans'" lib/v3/bridgepoint_app_v3.dart
          grep -q "bridgepoint_customer_plans_v944" lib/v3/bridgepoint_plans_v3.dart
          grep -q "Duration(milliseconds: 2600)" lib/v3/bridgepoint_map_weather_v3.dart
          grep -q "Icons.roofing_rounded" lib/v3/bridgepoint_map_weather_v3.dart
          ! grep -q "P \$p  S \$s  O \$o" lib/v3/bridgepoint_map_weather_v3.dart
          echo 'V3 source contract verified.'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build V3 web app
        shell: bash
        run: |
          set -euo pipefail
          cat > web/bridgepoint-v3-release.json <<EOF
          {"architecture":"unified-v3","version":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","primary_navigation":["Home","Map","Properties","Work"],"plans_cta":"gold","customer_formula_surfaces":false,"radar_frame_ms":2600,"professional_map_markers":true,"parcel_progress_contract":"v942","source_truth_contract":"v943","customer_plan_contract":"v944"}
          EOF
          flutter build web --release -t lib/main_v2.dart --base-href "/app/" --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
          grep -q '<base href="/app/">' build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/assets/assets/brand/bridgepoint-mark-v80.svg
          cp web/bridgepoint-v3-release.json build/web/bridgepoint-v3-release.json
          touch build/web/.nojekyll

      - name: Build quota-free handoff chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v3-delta /tmp/v3-handoff
          mkdir -p /tmp/v3-delta /tmp/v3-handoff
          for f in index.html main.dart.js flutter.js flutter_bootstrap.js flutter_service_worker.js manifest.json version.json favicon.png acquisition_tracker.js bridgepoint-v3-release.json .nojekyll; do
            if [ -e "build/web/$f" ]; then cp -a "build/web/$f" /tmp/v3-delta/; fi
          done
          mkdir -p /tmp/v3-delta/assets/assets/brand
          cp build/web/assets/assets/brand/bridgepoint-mark-v80.svg /tmp/v3-delta/assets/assets/brand/
          if [ -d build/web/assets/fonts ]; then
            mkdir -p /tmp/v3-delta/assets
            cp -a build/web/assets/fonts /tmp/v3-delta/assets/
          fi
          for f in AssetManifest.bin AssetManifest.bin.json FontManifest.json NOTICES.Z; do
            if [ -e "build/web/assets/$f" ]; then mkdir -p /tmp/v3-delta/assets; cp -a "build/web/assets/$f" /tmp/v3-delta/assets/; fi
          done
          tar -C /tmp/v3-delta -czf /tmp/v3-delta.tar.gz .
          base64 -w0 /tmp/v3-delta.tar.gz > /tmp/v3-delta.tar.gz.b64
          split -b 400000 -d -a 3 /tmp/v3-delta.tar.gz.b64 /tmp/v3-handoff/chunk-
          SHA256="$(sha256sum /tmp/v3-delta.tar.gz | awk '{print $1}')"
          BYTES="$(stat -c '%s' /tmp/v3-delta.tar.gz)"
          CHUNKS="$(find /tmp/v3-handoff -type f -name 'chunk-*' | wc -l)"
          cat > /tmp/v3-handoff/manifest.json <<EOF
          {"architecture":"unified-v3","source_sha":"${GITHUB_SHA}","source_run":${GITHUB_RUN_ID},"archive_sha256":"${SHA256}","archive_bytes":${BYTES},"chunk_count":${CHUNKS},"chunk_encoding":"base64","chunk_size":400000,"target":"bridgepoint-live/live-artifact/app","primary_navigation":["Home","Map","Properties","Work"],"plans_cta":"gold","radar_frame_ms":2600,"parcel_progress_contract":"v942","source_truth_contract":"v943","customer_plan_contract":"v944"}
          EOF
          cat /tmp/v3-handoff/manifest.json

      - name: Publish compiled handoff only after all gates pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v3-handoff
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b clean-v2-standard-handoff
          git add -A
          git commit -m "Unified V3 compiled handoff ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin clean-v2-standard-handoff
