name: Cobb County Parcel ID v1850

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cobb-parcel-id-v1850.yml'
      - 'config/parcels/ga/cobb_county_parcel_id_v1850.json'
      - 'docs/source-evidence/parcels/ga/cobb_county_v1850.md'
      - 'supabase/functions/bridgepoint-cobb-parcel-id-v1850/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-official-source:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.live.outputs.count }}
      last_edit: ${{ steps.live.outputs.last_edit }}
    steps:
      - uses: actions/checkout@v4

      - name: Live validate Cobb official parcel service
        id: live
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://services.arcgis.com/HYLRafMc4Ux6DA8c/ArcGIS/rest/services/CobbParcels/FeatureServer'
          LAYER="$ROOT/0"
          ITEM_EXPECTED='d810aab5b7504c9882c1e61583dd035a'

          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 "$ROOT?f=json" -o /tmp/root.json
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 "$LAYER?f=json" -o /tmp/layer.json
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 "$LAYER/query?where=1%3D1&returnCountOnly=true&f=json" -o /tmp/count.json

          ITEM="$(jq -r '.serviceItemId // empty' /tmp/root.json)"
          NAME="$(jq -r '.name // empty' /tmp/layer.json)"
          GEOM="$(jq -r '.geometryType // empty' /tmp/layer.json)"
          COUNT="$(jq -r '.count // 0' /tmp/count.json)"
          LAST_EDIT_MS="$(jq -r '.editingInfo.lastEditDate // .editingInfo.dataLastEditDate // 0' /tmp/layer.json)"

          test "$ITEM" = "$ITEM_EXPECTED"
          test "$NAME" = 'CobbParcels'
          test "$GEOM" = 'esriGeometryPolygon'
          jq -e '[.fields[].name] | index("PARCEL_ID") != null' /tmp/layer.json >/dev/null
          jq -e '[.fields[].name] | index("PIN") != null' /tmp/layer.json >/dev/null
          test "$COUNT" -ge 100000

          MIN_EDIT_MS="$(date -u -d '2026-07-01T00:00:00Z' +%s000)"
          if [ "$LAST_EDIT_MS" -gt 0 ]; then test "$LAST_EDIT_MS" -ge "$MIN_EDIT_MS"; fi

          LAST_EDIT='unknown'
          if [ "$LAST_EDIT_MS" -gt 0 ]; then LAST_EDIT="$(date -u -d "@$((LAST_EDIT_MS/1000))" +'%Y-%m-%dT%H:%M:%SZ')"; fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "last_edit=$LAST_EDIT" >> "$GITHUB_OUTPUT"
          echo "Cobb official parcel source validated: count=$COUNT last_edit=$LAST_EDIT item=$ITEM"

      - name: Verify code stays parcel-ID-only
        shell: bash
        run: |
          set -euo pipefail
          F='supabase/functions/bridgepoint-cobb-parcel-id-v1850/index.ts'
          test -s "$F"
          grep -q 'outFields=FID%2CPARCEL_ID%2CPIN' "$F"
          grep -q 'returnGeometry=false' "$F"
          grep -q 'EXACT_CANDIDATE_NOT_COMPLIANCE_APPROVED' "$F"
          ! grep -q 'outFields=\*' "$F"

  deploy-if-authorized:
    needs: validate-official-source
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xdfsjztwgsbmabshzsjw
    steps:
      - uses: actions/checkout@v4

      - name: Deploy fail-closed Cobb worker when repository is authorized
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured in this repository; source validation passed but deployment is intentionally skipped.'
            exit 0
          fi
          npx --yes supabase@latest functions deploy bridgepoint-cobb-parcel-id-v1850 --project-ref "$PROJECT_REF" --no-verify-jwt
          echo "Deployed bridgepoint-cobb-parcel-id-v1850 after live source validation."
          echo "Validated source count: ${{ needs.validate-official-source.outputs.count }}"
          echo "Validated source last edit: ${{ needs.validate-official-source.outputs.last_edit }}"
