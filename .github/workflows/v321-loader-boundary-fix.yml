name: Repair v321 NOAA loader boundary detection

on:
  push:
    branches: [mobile-v325-release-compat]
    paths:
      - '.github/workflows/v321-loader-boundary-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v325-release-compat
      - shell: python
        run: |
          from pathlib import Path
          p=Path('tool/repair_v321_responsive_generated.py')
          s=p.read_text()
          old="""fn_end=body.find('\\n  }',fn_start)\nif fn_end<0:\n    raise SystemExit('v321 repair: NOAA frame loader end missing')\n# Include enough of the function to capture compact catch forms.\nsegment=body[fn_start:fn_end+4]\n"""
          new="""open_brace=body.find('{',fn_start)\nif open_brace<0:\n    raise SystemExit('v321 repair: NOAA frame loader opening brace missing')\ndepth=0;quote=None;escaped=False;fn_end=None\nfor i in range(open_brace,len(body)):\n    ch=body[i]\n    if quote is not None:\n        if escaped: escaped=False\n        elif ch=='\\\\': escaped=True\n        elif ch==quote: quote=None\n        continue\n    if ch in (\"'\",'\\\"'):\n        quote=ch;continue\n    if ch=='{': depth+=1\n    elif ch=='}':\n        depth-=1\n        if depth==0:\n            fn_end=i+1\n            break\nif fn_end is None:\n    raise SystemExit('v321 repair: NOAA frame loader end missing')\nsegment=body[fn_start:fn_end]\n"""
          if old not in s:
              raise SystemExit('v321 old loader boundary block not found')
          s=s.replace(old,new,1)
          s=s.replace("body=body[:fn_start]+segment+body[fn_end+4:]","body=body[:fn_start]+segment+body[fn_end:]",1)
          p.write_text(s)
          Path('.github/workflows/v321-loader-boundary-fix.yml').unlink()
      - run: |
          git config user.name 'BridgePoint Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Parse full NOAA loader before v321 fallback repair'
          git push origin HEAD:mobile-v325-release-compat
