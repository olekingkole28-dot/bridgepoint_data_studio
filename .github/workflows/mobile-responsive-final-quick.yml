name: BridgePoint corrected final phone layout patch

on:
  pull_request:
    paths:
      - '.github/mobile-responsive-trigger.txt'

permissions:
  contents: write

jobs:
  finalize-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply validated mobile patch
        run: python .github/scripts/final_mobile_patch.py

      - name: Commit final phone layout
        run: |
          git config user.name "BridgePoint Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finish phone-first Flutter responsive layouts"
          git push origin HEAD:main
