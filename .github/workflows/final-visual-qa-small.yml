# Shared visual QA trigger v1
name: BridgePoint Shared Visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-qa-small.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tool/final_visual_qa.py
      - name: Commit shared visual polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Visual QA'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_intelligence_surfaces_v2.dart
          git commit -m 'Polish shared intelligence cards and states'
          git push origin HEAD:main
