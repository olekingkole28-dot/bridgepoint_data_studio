# trigger v2
name: Run Product Audit Patch V850

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-product-audit-patch-v850.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited product repairs
        run: python .github/scripts/product_audit_patch_v850.py
      - name: Commit product repairs
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Product QA'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/
          git diff --cached --quiet && exit 0
          git commit -m 'Apply V850 hidden product-surface repairs'
          git push origin HEAD:main
