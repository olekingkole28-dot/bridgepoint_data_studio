name: Run Productized V2 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-productized-release.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Build exact productized source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run productized-v2-release.yml --ref main --repo olekingkole28-dot/bridgepoint_data_studio
