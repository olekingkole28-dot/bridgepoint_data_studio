name: Decode v319 patch for compatibility review

on:
  push:
    branches: [mobile-v325-release-compat]
    paths:
      - '.github/workflows/decode-v319-patch.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v325-release-compat
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path
          import ast,base64,re,zlib
          s=Path('tool/apply_owner_patterns_radar_v319.py').read_text()
          m=re.search(r"blob=(?P<q>'[^']*'|\"[^\"]*\")",s)
          if not m: raise SystemExit('v319 blob not found')
          blob=ast.literal_eval(m.group('q'))
          patch=zlib.decompress(base64.b64decode(blob)).decode('utf-8')
          Path('.github/v319-decoded.patch').write_text(patch)
          Path('.github/workflows/decode-v319-patch.yml').unlink()
      - run: |
          git config user.name 'BridgePoint Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Decode v319 patch for compatibility review'
          git push origin HEAD:mobile-v325-release-compat
