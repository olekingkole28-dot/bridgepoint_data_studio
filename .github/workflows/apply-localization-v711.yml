name: Apply Localization V711

on:
  push:
    branches:
      - chatgpt/ui-refresh-v691
    paths:
      - tool/apply_localization_v711.py
      - .github/workflows/apply-localization-v711.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-localization-v711
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ui-refresh-v691
      - name: Apply localization bootstrap
        run: |
          set -euo pipefail
          python tool/apply_localization_v711.py
          grep -q 'bridgepoint-localization-v711' lib/main.dart
          grep -q 'bridgepoint_supported_languages_v711' lib/main.dart
          grep -q 'bridgepoint_save_locale_v711' lib/main.dart
      - name: Format and analyze
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format lib/main.dart
      - run: flutter analyze --no-fatal-infos
      - name: Persist localization source
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Localization Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/main.dart pubspec.lock
          if git diff --cached --quiet; then
            echo 'Localization V711 source already current.'
          else
            git commit -m 'Apply BridgePoint localization V711 [skip ci]'
            git push origin HEAD:chatgpt/ui-refresh-v691
          fi
