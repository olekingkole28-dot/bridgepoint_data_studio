name: Publish BridgePoint Pages

on:
  workflow_run:
    workflows: ["Flutter Web Release"]
    types: [completed]

concurrency:
  group: bridgepoint-pages-production
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download audited Flutter web release
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-flutter-web-review
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify production release marker
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/bridgepoint-release.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker=json.loads(Path('site/bridgepoint-release.json').read_text(encoding='utf-8'))
          if marker.get('public_origin')!='https://bridgepointintelligence.online/':
              raise SystemExit(f"Unexpected public origin: {marker.get('public_origin')}")
          if not marker.get('version'):
              raise SystemExit('Release version is missing')
          if marker['version'] != os.environ['EXPECTED_SHA']:
              raise SystemExit(f"Artifact SHA {marker['version']} does not match workflow SHA {os.environ['EXPECTED_SHA']}")
          print('Publishing audited BridgePoint release',marker['version'])
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint Intelligence
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout release repository for deployment receipt
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Record verified production deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          marker=json.loads(Path('site/bridgepoint-release.json').read_text(encoding='utf-8'))
          receipt={
              'status':'PUBLISHED',
              'version':marker['version'],
              'built_at':marker.get('built_at'),
              'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'public_origin':marker.get('public_origin'),
              'pages_url':os.environ['PAGE_URL'],
              'source_workflow_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_sha':os.environ['SOURCE_SHA'],
              'publisher':'GitHub Pages / audited artifact'
          }
          out=Path('repo/web/deployment-status.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
          cd repo
          git config user.name "BridgePoint Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/deployment-status.json
          if git diff --cached --quiet; then
            echo "Deployment receipt already current."
          else
            git commit -m "Record BridgePoint production deployment [skip ci]"
            git push origin HEAD:main
          fi
