name: BridgePoint Clean V2 Canonical Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze canonical Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Clean V2 responsive tests
        run: flutter test

      - name: Build canonical Clean V2 web release
        run: flutter build web --release -t lib/main_v2.dart --base-href "/"

      - name: Verify canonical Clean V2 artifact
        run: |
          set -euo pipefail
          test -s build/web/index.html
          grep -q "Install BridgePoint" build/web/index.html
          ! grep -q "bp-expansion-launcher" build/web/index.html
          echo "Clean V2 canonical source audit passed."

      - uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-clean-v2-canonical-web
          path: build/web
          if-no-files-found: error
          retention-days: 7
