# V853 deterministic product repair + release gate
name: Run Product Audit Patch V851

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-product-audit-patch-v851.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic V852 repairs
        run: python .github/scripts/product_release_repair_v852.py
      - name: Apply V853 checkout repair
        run: python .github/scripts/package_checkout_patch_v853.py
      - name: Run deep product regression audit
        run: python .github/scripts/product_release_audit_v852.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run release tests
        run: flutter test
      - name: Build production web app
        run: flutter build web --release -t lib/main_v2.dart --base-href "/app/"
      - name: Commit verified V853 repairs
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Product QA'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/
          git diff --cached --quiet && exit 0
          git commit -m 'Apply verified V853 checkout repair'
          git push origin HEAD:main
