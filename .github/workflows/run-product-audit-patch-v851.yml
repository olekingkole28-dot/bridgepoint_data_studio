# trigger v2
name: Run Product Audit Patch V851

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-product-audit-patch-v851.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V851 repairs
        run: python .github/scripts/product_audit_patch_v851.py
      - name: Commit V851 repairs
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Product QA'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/
          git diff --cached --quiet && exit 0
          git commit -m 'Apply V851 weather operations calendar repairs'
          git push origin HEAD:main
