name: One-off V969 map and opportunity clarity hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-v969-map-opportunity-clarity.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch production Clean V2 map and opportunities
        run: python .github/scripts/one_off_v969_map_opportunity_clarity.py

      - name: Verify hotfix source contract
        run: |
          grep -q "String _propertyLabel" lib/v2/bridgepoint_map_weather_v2.dart
          grep -q "Icons.sensors_rounded" lib/v2/bridgepoint_map_weather_v2.dart
          grep -q "_opportunityIconFor" lib/v2/bridgepoint_opportunities_v2.dart
          grep -q "Owner source" lib/v2/bridgepoint_opportunities_v2.dart

      - name: Commit hotfix and dispatch Clean V2 build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-off-v969-map-opportunity-clarity.yml
          git rm .github/scripts/one_off_v969_map_opportunity_clarity.py
          git add lib/v2/bridgepoint_map_weather_v2.dart lib/v2/bridgepoint_opportunities_v2.dart
          git commit -m 'V969 clarify map and opportunity intelligence icons'
          git push origin HEAD:main
          gh workflow run flutter-web-v2-production.yml --ref main
