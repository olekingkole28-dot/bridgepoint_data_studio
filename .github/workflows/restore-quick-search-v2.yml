name: Restore Quick Search V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-quick-search-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore functional global search and notification shortcut
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          prop=Path('lib/v2/bridgepoint_property_360_v2.dart')
          s=prop.read_text()
          old="""class BridgePointProperty360V2 extends StatefulWidget {
  const BridgePointProperty360V2({super.key});

  @override
"""
          new="""class BridgePointProperty360V2 extends StatefulWidget {
  const BridgePointProperty360V2({super.key, this.initialQuery});

  final String? initialQuery;

  @override
"""
          if old in s:
              s=s.replace(old,new)
          elif 'final String? initialQuery;' not in s:
              raise SystemExit('Property360 constructor marker missing')
          state_marker="""  static const _amber = Color(0xFFFFC857);

  @override
  void dispose() {
"""
          state_insert="""  static const _amber = Color(0xFFFFC857);

  @override
  void initState() {
    super.initState();
    final initial = widget.initialQuery?.trim();
    if (initial != null && initial.length >= 2) {
      _query.text = initial;
      WidgetsBinding.instance.addPostFrameCallback((_) {
        if (mounted) _search();
      });
    }
  }

  @override
  void dispose() {
"""
          if 'void initState()' not in s[:s.find('Map<String, dynamic> _map')]:
              if state_marker not in s: raise SystemExit('Property360 init marker missing')
              s=s.replace(state_marker,state_insert)
          prop.write_text(s)

          app=Path('lib/v2/bridgepoint_app_v2.dart')
          s=app.read_text()
          fields="""  _AreaV2 selected = _AreaV2.home;
  bool owner = false;
  bool ownerChecked = false;
"""
          fields_new="""  _AreaV2 selected = _AreaV2.home;
  bool owner = false;
  bool ownerChecked = false;
  final TextEditingController _globalSearch = TextEditingController();
  String? _propertySearchSeed;
"""
          if '_globalSearch' not in s:
              if fields not in s: raise SystemExit('Workspace fields marker missing')
              s=s.replace(fields,fields_new)

          init_marker="""  @override
  void initState() {
    super.initState();
    _checkOwner();
  }

  Future<void> _checkOwner() async {
"""
          init_new="""  @override
  void initState() {
    super.initState();
    _checkOwner();
  }

  @override
  void dispose() {
    _globalSearch.dispose();
    super.dispose();
  }

  void _openPropertyQuery(String raw) {
    final query = raw.trim();
    if (query.length < 2) return;
    setState(() {
      _propertySearchSeed = query;
      selected = _AreaV2.property;
    });
  }

  Future<void> _showMobilePropertySearch() async {
    final controller = TextEditingController(text: _globalSearch.text);
    final query = await showDialog<String>(
      context: context,
      builder: (context) => AlertDialog(
        title: const Text('Search BridgePoint properties'),
        content: TextField(
          controller: controller,
          autofocus: true,
          textInputAction: TextInputAction.search,
          onSubmitted: (value) => Navigator.pop(context, value),
          decoration: const InputDecoration(
            labelText: 'Address, parcel, owner or municipality',
            prefixIcon: Icon(Icons.search_rounded),
          ),
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(context),
            child: const Text('Cancel'),
          ),
          FilledButton.icon(
            onPressed: () => Navigator.pop(context, controller.text),
            icon: const Icon(Icons.search_rounded),
            label: const Text('Search'),
          ),
        ],
      ),
    );
    final clean = query?.trim();
    controller.dispose();
    if (clean != null && clean.length >= 2) {
      _globalSearch.text = clean;
      _openPropertyQuery(clean);
    }
  }

  Future<void> _checkOwner() async {
"""
          if 'void _openPropertyQuery(' not in s:
              if init_marker not in s: raise SystemExit('Workspace init marker missing')
              s=s.replace(init_marker,init_new)

          prop_page="""        _AreaV2.property => const BridgePointProperty360V2(),
"""
          prop_page_new="""        _AreaV2.property => BridgePointProperty360V2(
            key: ValueKey(_propertySearchSeed),
            initialQuery: _propertySearchSeed,
          ),
"""
          if 'initialQuery: _propertySearchSeed' not in s:
              if prop_page not in s: raise SystemExit('Property page switch marker missing')
              s=s.replace(prop_page,prop_page_new)

          mobile_actions="""          actions: [
            if (owner)
"""
          mobile_new="""          actions: [
            IconButton(
              tooltip: 'Search properties',
              onPressed: _showMobilePropertySearch,
              icon: const Icon(Icons.search_rounded),
            ),
            IconButton(
              tooltip: 'Notifications and saved alerts',
              onPressed: () => setState(() => selected = _AreaV2.savedAlerts),
              icon: const Icon(Icons.notifications_none_rounded),
            ),
            if (owner)
"""
          if "tooltip: 'Search properties'" not in s:
              if mobile_actions not in s: raise SystemExit('Mobile action marker missing')
              s=s.replace(mobile_actions,mobile_new,1)

          desktop_marker="""                      if (owner)
                        TextButton.icon(
                          onPressed: () =>
                              setState(() => selected = _AreaV2.investment),
"""
          desktop_insert="""                      if (width >= 1080) ...[
                        SizedBox(
                          width: width >= 1380 ? 360 : 270,
                          child: TextField(
                            controller: _globalSearch,
                            textInputAction: TextInputAction.search,
                            onSubmitted: _openPropertyQuery,
                            decoration: InputDecoration(
                              hintText: 'Search address, parcel, owner…',
                              prefixIcon: const Icon(Icons.search_rounded),
                              suffixIcon: IconButton(
                                tooltip: 'Search',
                                onPressed: () => _openPropertyQuery(_globalSearch.text),
                                icon: const Icon(Icons.arrow_forward_rounded),
                              ),
                              isDense: true,
                            ),
                          ),
                        ),
                        const SizedBox(width: 8),
                      ],
                      IconButton(
                        tooltip: 'Notifications and saved alerts',
                        onPressed: () => setState(() => selected = _AreaV2.savedAlerts),
                        icon: const Icon(Icons.notifications_none_rounded),
                      ),
                      if (owner)
                        TextButton.icon(
                          onPressed: () =>
                              setState(() => selected = _AreaV2.investment),
"""
          if "hintText: 'Search address, parcel, owner…'" not in s:
              if desktop_marker not in s: raise SystemExit('Desktop toolbar marker missing')
              s=s.replace(desktop_marker,desktop_insert,1)
          app.write_text(s)
          PY
          git diff --check
      - name: Commit functional quick controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_app_v2.dart lib/v2/bridgepoint_property_360_v2.dart
          if git diff --cached --quiet; then
            echo 'Quick controls already restored.'
            exit 0
          fi
          git commit -m 'Restore global property search and notification access'
          git push origin HEAD:main
