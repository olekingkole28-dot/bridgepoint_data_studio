name: Wire Saved Alerts V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-saved-alerts-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Saved and Alerts workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/v2/bridgepoint_app_v2.dart')
          s=p.read_text()
          if "import 'bridgepoint_saved_alerts_v2.dart';" not in s:
              s=s.replace("import 'bridgepoint_public_landing_v2.dart';\n", "import 'bridgepoint_public_landing_v2.dart';\nimport 'bridgepoint_saved_alerts_v2.dart';\n")
          if "  savedAlerts,\n" not in s:
              s=s.replace("  models,\n  buildings,", "  models,\n  savedAlerts,\n  buildings,")
          marker="  _AreaSpecV2(_AreaV2.models, 'Models', Icons.psychology_alt_rounded),\n"
          insert=marker+"  _AreaSpecV2(_AreaV2.savedAlerts, 'Saved & Alerts', Icons.bookmark_added_outlined),\n"
          if "_AreaV2.savedAlerts, 'Saved & Alerts'" not in s:
              if marker not in s: raise SystemExit('models nav marker missing')
              s=s.replace(marker,insert)
          page_marker="        _AreaV2.models => const BridgePointModelsV2(),\n"
          if "_AreaV2.savedAlerts =>" not in s:
              if page_marker not in s: raise SystemExit('models page marker missing')
              s=s.replace(page_marker,page_marker+"        _AreaV2.savedAlerts => const BridgePointSavedAlertsV2(),\n")
          title_marker="      _AreaV2.models => 'Models',\n"
          if "_AreaV2.savedAlerts => 'Saved & Alerts'" not in s:
              if title_marker not in s: raise SystemExit('models title marker missing')
              s=s.replace(title_marker,title_marker+"      _AreaV2.savedAlerts => 'Saved & Alerts',\n")
          p.write_text(s)
          PY
          git diff --check
      - name: Commit navigation restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_app_v2.dart
          if git diff --cached --quiet; then
            echo 'Saved & Alerts is already wired.'
            exit 0
          fi
          git commit -m 'Expose Saved and Alerts workspace in Clean V2'
          git push origin HEAD:main
