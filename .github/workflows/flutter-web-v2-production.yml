name: BridgePoint Clean V2 Release Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/main_v2.dart'
      - 'lib/v2/**'
      - 'lib/bridgepoint_intelligence_studio_v790.dart'
      - 'lib/bridgepoint_integrations_hub_v790.dart'
      - 'lib/screens/bridgepoint_owner**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - '.github/workflows/flutter-web-v2-production.yml'

permissions:
  contents: write

concurrency:
  group: bridgepoint-clean-v2-release-build
  cancel-in-progress: true

jobs:
  build-release-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Clean V2 release source
        run: |
          set -euo pipefail
          test -s lib/main_v2.dart
          test -s lib/v2/bridgepoint_app_v2.dart
          test -s lib/v2/bridgepoint_home_live_v2.dart
          test -s lib/v2/bridgepoint_properties_v2.dart
          test -s lib/v2/bridgepoint_opportunities_v2.dart
          test -s lib/v2/bridgepoint_investor_v2.dart
          test -s lib/v2/bridgepoint_buildings_v2.dart
          test -s lib/v2/bridgepoint_property_360_v2.dart
          test -s lib/v2/bridgepoint_map_weather_v2.dart
          test -s lib/v2/bridgepoint_saved_alerts_v2.dart
          test -s lib/v2/bridgepoint_operations_workspace_v2.dart
          test -s lib/v2/bridgepoint_claims_v2.dart
          test -s lib/v2/bridgepoint_products_settings_v2.dart
          test -s lib/v2/bridgepoint_intelligence_live_v2.dart
          test -s lib/screens/bridgepoint_owner_overview_v2.dart
          test -s lib/screens/bridgepoint_owner_v2_requirements_v832.dart
          test -s assets/brand/bridgepoint-mark-v80.svg
          python - <<'PY'
          from pathlib import Path
          roots=[Path('lib/main_v2.dart'),*Path('lib/v2').rglob('*.dart'),Path('lib/bridgepoint_intelligence_studio_v790.dart'),Path('lib/bridgepoint_integrations_hub_v790.dart'),*Path('lib/screens').glob('bridgepoint_owner*.dart')]
          source='\n'.join(p.read_text(encoding='utf-8') for p in roots if p.exists())
          required=[
            'BridgePointV2App','BridgePointHomeLiveV2','BridgePointPropertiesV2','BridgePointOpportunitiesV2','BridgePointInvestorV2','BridgePointBuildingsV2','BridgePointProperty360V2','BridgePointMapWeatherV2','BridgePointSavedAlertsV2','BridgePointOperationsWorkspaceV2','BridgePointClaimsV2','BridgePointCalendarV2','BridgePointPortfolioRiskV2','BridgePointAiV2','BridgePointIntelligenceStudio','BridgePointIntelligenceLiveV2','BridgePointIntegrationsHub','BridgePointProductsSettingsV2','BridgePointOwnerCommandCenter','BridgePointOwnerOverviewV2',
            'bridgepoint_owner_v2_requirements_v832','bridgepoint_property_geometry_v837','bridgepoint_property_timeline_v78','bridgepoint_flutter_intelligence_map_national_v346','bridgepoint_flutter_intelligence_map','bridgepoint_flutter_map_state_status_v838','bridgepoint_flutter_property_map_viewport_v838','bridgepoint_flutter_properties_state_browse_v840','bridgepoint_flutter_opportunities_state_v341','bridgepoint_save_opportunity_v70','bridgepoint_notifications_v74','bridgepoint_customer_notes_v70','bridgepoint_watchlists_v88','my_saved_searches','my_favorites','bridgepoint_security_center_v147'
          ]
          missing=[x for x in required if x not in source]
          if missing: raise SystemExit('Missing V2 production markers: '+', '.join(missing))
          forbidden=['apply_launch_v95.py','apply_weather_home_community_v145.py','apply_map_viewport_v124.py','repair_owner_expansion_v96.py']
          leaked=[x for x in forbidden if x in source]
          if leaked: raise SystemExit('Historical patch machinery leaked into Clean V2: '+', '.join(leaked))
          print('Clean V2 restored source contract verified.')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run release tests
        run: flutter test

      - name: Stamp and build /app release
        run: |
          set -euo pipefail
          cat > web/bridgepoint-v2-release.json <<EOF
          {"architecture":"clean-v2","version":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","backend":"existing-production-supabase","historical_patch_replay":false,"production_candidate":true,"restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true}
          EOF
          flutter build web --release -t lib/main_v2.dart --base-href "/app/" --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
          grep -q '<base href="/app/">' build/web/index.html
          grep -q 'Install BridgePoint' build/web/index.html
          ! grep -q 'bp-expansion-launcher' build/web/index.html
          test -s build/web/assets/assets/brand/bridgepoint-mark-v80.svg
          test -s build/web/assets/fonts/MaterialIcons-Regular.otf
          MAIN_SHA="$(sha256sum build/web/main.dart.js | awk '{print $1}')"
          ICON_FONT_SHA="$(sha256sum build/web/assets/fonts/MaterialIcons-Regular.otf | awk '{print $1}')"
          cat > build/web/bridgepoint-release.json <<EOF
          {"version":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","public_origin":"https://bridgepointintelligence.online/","architecture":"clean-v2","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true,"material_icon_font_sha256":"${ICON_FONT_SHA}"}
          EOF
          cat > build/web/public-promotion-v682.json <<EOF
          {"public_release":"clean-v2","compiled_source_sha":"${GITHUB_SHA}","private_build_run":${GITHUB_RUN_ID},"main_js_sha256":"${MAIN_SHA}","material_icon_font_sha256":"${ICON_FONT_SHA}","source_repo_private":true,"architecture":"clean-v2","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"current_icon_font":true}
          EOF
          touch build/web/.nojekyll

      - name: Build quota-free handoff chunks
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-delta /tmp/v2-handoff
          mkdir -p /tmp/v2-delta /tmp/v2-handoff
          for f in index.html main.dart.js flutter.js flutter_bootstrap.js flutter_service_worker.js manifest.json version.json favicon.png acquisition_tracker.js bridgepoint-v2-release.json bridgepoint-release.json public-promotion-v682.json .nojekyll; do
            if [ -e "build/web/$f" ]; then cp -a "build/web/$f" /tmp/v2-delta/; fi
          done
          mkdir -p /tmp/v2-delta/assets/assets/brand
          cp build/web/assets/assets/brand/bridgepoint-mark-v80.svg /tmp/v2-delta/assets/assets/brand/
          if [ -d build/web/assets/fonts ]; then
            mkdir -p /tmp/v2-delta/assets
            cp -a build/web/assets/fonts /tmp/v2-delta/assets/
          fi
          for f in AssetManifest.bin AssetManifest.bin.json FontManifest.json NOTICES.Z; do
            if [ -e "build/web/assets/$f" ]; then
              mkdir -p /tmp/v2-delta/assets
              cp -a "build/web/assets/$f" /tmp/v2-delta/assets/
            fi
          done
          test -s /tmp/v2-delta/assets/fonts/MaterialIcons-Regular.otf
          tar -C /tmp/v2-delta -czf /tmp/v2-delta.tar.gz .
          base64 -w0 /tmp/v2-delta.tar.gz > /tmp/v2-delta.tar.gz.b64
          split -b 400000 -d -a 3 /tmp/v2-delta.tar.gz.b64 /tmp/v2-handoff/chunk-
          SHA256="$(sha256sum /tmp/v2-delta.tar.gz | awk '{print $1}')"
          BYTES="$(stat -c '%s' /tmp/v2-delta.tar.gz)"
          CHUNKS="$(find /tmp/v2-handoff -type f -name 'chunk-*' | wc -l)"
          FONT_SHA="$(sha256sum /tmp/v2-delta/assets/fonts/MaterialIcons-Regular.otf | awk '{print $1}')"
          cat > /tmp/v2-handoff/manifest.json <<EOF
          {"architecture":"clean-v2","source_sha":"${GITHUB_SHA}","source_run":${GITHUB_RUN_ID},"archive_sha256":"${SHA256}","archive_bytes":${BYTES},"chunk_count":${CHUNKS},"chunk_encoding":"base64","chunk_size":400000,"target":"bridgepoint-live/live-artifact/app","restored_product_surfaces":true,"progressive_national_map":true,"saved_alerts_restored":true,"opportunities_restored":true,"brand_asset_included":true,"material_icon_font_included":true,"material_icon_font_sha256":"${FONT_SHA}"}
          EOF
          cat /tmp/v2-handoff/manifest.json

      - name: Publish private handoff branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/v2-handoff
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b clean-v2-handoff
          git add -A
          git commit -m "Clean V2 restored compiled handoff ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin clean-v2-handoff
