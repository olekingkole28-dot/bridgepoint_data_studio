# V1900 authoritative Clean V2 compiler/handoff with 3D world static surfaces
name: BridgePoint Clean V2 Release Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/main_v2.dart'
      - 'lib/v2/**'
      - 'lib/bridgepoint_intelligence_studio_v790.dart'
      - 'lib/bridgepoint_integrations_hub_v790.dart'
      - 'lib/screens/bridgepoint_owner**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - '.github/scripts/product_release_audit_v852.py'
      - '.github/workflows/flutter-web-v2-production.yml'

permissions:
  contents: write

concurrency:
  group: bridgepoint-clean-v2-release-build
  cancel-in-progress: true

jobs:
  build-release-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Clean V2 release source
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/main_v2.dart
          test -s lib/v2/bridgepoint_app_v2.dart
          test -s lib/v2/bridgepoint_home_v2.dart
          test -s lib/v2/bridgepoint_map_weather_v2.dart
          test -s lib/v2/bridgepoint_products_settings_v2.dart
          test -s lib/v2/bridgepoint_chrome_v2.dart
          test -s lib/screens/bridgepoint_owner_overview_v2.dart
          test -s lib/screens/bridgepoint_owner_command_center_v2.dart
          test -s lib/screens/bridgepoint_owner_download_center_v1896.dart
          test -s web/bridgepoint-3d-world/index.html
          test -s web/owner-downloads/bridgepoint-storage-check.ps1
          test -s web/owner-downloads/bridgepoint-local-node-readiness.ps1
          test -s web/owner-downloads/bridgepoint-full-export-readiness.md
          test -s assets/brand/bridgepoint-mark-v80.svg
          test ! -d lib/v3
          python - <<'PY'
          from pathlib import Path
          roots=[Path('lib/main_v2.dart'),*Path('lib/v2').rglob('*.dart'),Path('lib/bridgepoint_intelligence_studio_v790.dart'),Path('lib/bridgepoint_integrations_hub_v790.dart'),*Path('lib/screens').glob('bridgepoint_owner*.dart'),*Path('supabase/migrations').glob('*.sql')]
          source='\n'.join(p.read_text(encoding='utf-8') for p in roots if p.exists())
          required=[
            'BridgePointV2App','BridgePointHomeV2','BridgePointMapWeatherV2','BridgePointProductsSettingsV2',
            'BridgePointPropertiesV2','BridgePointOpportunitiesV2','BridgePointOwnerCommandCenterV2','BridgePointOwnerOverviewV2',
            'BridgePointOwnerDownloadCenterV1896','bridgepoint_owner_parcel_progress_v942','bridgepoint_owner_source_truth_v943','bridgepoint_customer_plans_v944'
          ]
          missing=[x for x in required if x not in source]
          if missing: raise SystemExit('Missing Clean V2 markers: '+', '.join(missing))
          app=Path('lib/v2/bridgepoint_app_v2.dart').read_text(encoding='utf-8')
          map_src=Path('lib/v2/bridgepoint_map_weather_v2.dart').read_text(encoding='utf-8')
          plans=Path('lib/v2/bridgepoint_products_settings_v2.dart').read_text(encoding='utf-8')
          owner=Path('lib/screens/bridgepoint_owner_overview_v2.dart').read_text(encoding='utf-8')
          chrome=Path('lib/v2/bridgepoint_chrome_v2.dart').read_text(encoding='utf-8')
          world=Path('web/bridgepoint-3d-world/index.html').read_text(encoding='utf-8')
          assert "static const primary = <_Area>[_Area.home, _Area.map, _Area.properties, _Area.work];" in app
          assert "label:'Plans'" in app or "label: 'Plans'" in app
          assert "if (owner) _Group(title:'Owner only'" in app or "if (owner) _Group(title: 'Owner only'" in app
          assert "Duration(milliseconds: 2600)" in map_src
          assert 'Icons.roofing_rounded' in map_src
          assert 'bridgepoint_customer_plans_v944' in plans
          assert 'bridgepoint_owner_parcel_progress_v942' in owner
          assert 'bridgepoint_owner_source_truth_v943' in owner
          assert '_BridgePointOrbitalDnaPainter' in chrome
          assert 'bridgepoint_3d_world_viewport_v1899' in world
          assert 'NEARMAP' not in world.upper()
          assert 'V3' not in app and 'V3' not in map_src and 'V3' not in plans and 'V3' not in owner
          print('Clean V2 + 3D world release contract verified.')
          PY

      - name: Deep product regression audit
        run: python .github/scripts/product_release_audit_v852.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run release tests
        run: flutter test

      - name: Build Clean V2 web app
        shell: bash
        run: |
          set -euo pipefail
          cat > web/bridgepoint-v2-release.json <<EOF
          {"architecture":"clean-v2","version":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","primary_navigation":["Home","Map","Properties","Work"],"plans_cta":"gold","customer_formula_surfaces":false,"radar_frame_ms":2600,"professional_map_markers":true,"orbital_dna_background":true,"parcel_progress_contract":"v942","source_truth_contract":"v943","customer_plan_contract":"v944","continuous_3d_world":true}
          EOF
          flutter build web --release -t lib/main_v2.dart --base-href "/app/" --dart-define=BRIDGEPOINT_RELEASE=${GITHUB_SHA}
          grep -q '<base href="/app/">' build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/assets/assets/brand/bridgepoint-mark-v80.svg
          test -s build/web/assets/fonts/MaterialIcons-Regular.otf
          test -s build/web/bridgepoint-3d-world/index.html
          test -s build/web/owner-downloads/bridgepoint-storage-check.ps1
          test -s build/web/owner-downloads/bridgepoint-local-node-readiness.ps1
          test -s build/web/owner-downloads/bridgepoint-full-export-readiness.md
          MAIN_SHA="$(sha256sum build/web/main.dart.js | awk '{print $1}')"
          FONT_SHA="$(sha256sum build/web/assets/fonts/MaterialIcons-Regular.otf | awk '{print $1}')"
          cp web/bridgepoint-v2-release.json build/web/bridgepoint-v2-release.json
          cat > build/web/bridgepoint-release.json <<EOF
          {"version":"${GITHUB_SHA}","architecture":"clean-v2","primary_navigation":["Home","Map","Properties","Work"],"plans_cta":"gold","customer_formula_surfaces":false,"radar_frame_ms":2600,"professional_map_markers":true,"orbital_dna_background":true,"parcel_progress_contract":"v942","source_truth_contract":"v943","customer_plan_contract":"v944","continuous_3d_world":true,"main_js_sha256":"${MAIN_SHA}","material_icon_font_sha256":"${FONT_SHA}"}
          EOF
          cat > build/web/public-promotion-v682.json <<EOF
          {"public_release":"clean-v2","compiled_source_sha":"${GITHUB_SHA}","private_build_run":${GITHUB_RUN_ID},"main_js_sha256":"${MAIN_SHA}","material_icon_font_sha256":"${FONT_SHA}","source_repo_private":true,"primary_navigation":["Home","Map","Properties","Work"],"plans_cta":"gold","radar_frame_ms":2600,"parcel_progress_contract":"v942","source_truth_contract":"v943","customer_plan_contract":"v944","continuous_3d_world":true}
          EOF
          touch build/web/.nojekyll

      - name: Build quota-free handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-delta /tmp/v2-handoff
          mkdir -p /tmp/v2-delta /tmp/v2-handoff
          for f in index.html main.dart.js flutter.js flutter_bootstrap.js flutter_service_worker.js manifest.json version.json favicon.png acquisition_tracker.js bridgepoint-v2-release.json bridgepoint-release.json public-promotion-v682.json .nojekyll; do
            if [ -e "build/web/$f" ]; then cp -a "build/web/$f" /tmp/v2-delta/; fi
          done
          for d in bridgepoint-3d-world owner-downloads; do
            if [ -d "build/web/$d" ]; then cp -a "build/web/$d" /tmp/v2-delta/; fi
          done
          mkdir -p /tmp/v2-delta/assets/assets/brand
          cp build/web/assets/assets/brand/bridgepoint-mark-v80.svg /tmp/v2-delta/assets/assets/brand/
          mkdir -p /tmp/v2-delta/assets
          cp -a build/web/assets/fonts /tmp/v2-delta/assets/
          for f in AssetManifest.bin AssetManifest.bin.json FontManifest.json NOTICES.Z; do
            if [ -e "build/web/assets/$f" ]; then cp -a "build/web/assets/$f" /tmp/v2-delta/assets/; fi
          done
          tar -C /tmp/v2-delta -czf /tmp/v2-delta.tar.gz .
          base64 -w0 /tmp/v2-delta.tar.gz > /tmp/v2-delta.tar.gz.b64
          split -b 400000 -d -a 3 /tmp/v2-delta.tar.gz.b64 /tmp/v2-handoff/chunk-
          SHA256="$(sha256sum /tmp/v2-delta.tar.gz | awk '{print $1}')"
          BYTES="$(stat -c '%s' /tmp/v2-delta.tar.gz)"
          CHUNKS="$(find /tmp/v2-handoff -type f -name 'chunk-*' | wc -l)"
          cat > /tmp/v2-handoff/manifest.json <<EOF
          {"architecture":"clean-v2","source_sha":"${GITHUB_SHA}","source_run":${GITHUB_RUN_ID},"archive_sha256":"${SHA256}","archive_bytes":${BYTES},"chunk_count":${CHUNKS},"chunk_encoding":"base64","chunk_size":400000,"target":"bridgepoint-live/live-artifact/app","primary_navigation":["Home","Map","Properties","Work"],"plans_cta":"gold","radar_frame_ms":2600,"parcel_progress_contract":"v942","source_truth_contract":"v943","customer_plan_contract":"v944","continuous_3d_world":true,"owner_downloads":true}
          EOF

      - name: Publish validated Clean V2 handoff branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v2-handoff
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b clean-v2-standard-handoff
          git add -A
          git commit -m "Clean V2 compiled handoff ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin clean-v2-standard-handoff
