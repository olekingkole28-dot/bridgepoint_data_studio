name: BridgePoint World V2500 browser smoke
on:
  push:
    branches: [bridgepoint-world-v2500]
    paths:
      - 'web/bridgepoint-3d-world/**'
      - 'scripts/world_v2500_browser_smoke.mjs'
      - '.github/workflows/world-v2500-browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridgepoint-world-v2500
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static V2500 world server
        working-directory: web/bridgepoint-3d-world
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/world-v2500-http.log 2>&1 &
          echo $! > /tmp/world-v2500-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/world-v2500-http.log
          exit 1
      - name: Run Chromium WebGL smoke
        env:
          WORLD_URL: http://127.0.0.1:8765/index.html
        run: node scripts/world_v2500_browser_smoke.mjs
      - name: Upload visual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v2500-browser-smoke-${{ github.sha }}
          path: artifacts/world-v2500-browser-smoke.*
          if-no-files-found: warn
          retention-days: 14
