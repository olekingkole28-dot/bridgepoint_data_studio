name: Fix Restored V2 Const

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-restored-v2-const.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix two invalid const wrappers
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'lib/v2/bridgepoint_home_live_v2.dart',
              'lib/v2/bridgepoint_public_landing_v2.dart',
          ]:
              p = Path(name)
              s = p.read_text()
              s = s.replace('const ConstrainedBox(\n', 'ConstrainedBox(\n')
              s = s.replace('constraints: BoxConstraints(', 'constraints: const BoxConstraints(')
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/v2/bridgepoint_home_live_v2.dart lib/v2/bridgepoint_public_landing_v2.dart
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix restored V2 const wrappers'
          git push origin HEAD:main
