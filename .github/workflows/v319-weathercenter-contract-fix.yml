name: Align v319 Weather Center compatibility contract

on:
  push:
    branches: [mobile-v325-release-compat]
    paths:
      - '.github/workflows/v319-weathercenter-contract-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v325-release-compat
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path
          p=Path('tool/repair_v319_responsive_generated.py')
          s=p.read_text()
          old="""    if getter_start<0:\n        raise SystemExit('v319 responsive repair: Weather Center time getter name missing')\n    getter_end=body.find(';',getter_start)\n    if getter_end<0 or getter_end-getter_start>500:\n        raise SystemExit('v319 responsive repair: Weather Center time getter terminator missing')\n    body=body[:getter_start]+new_time+body[getter_end+1:]\n"""
          new="""    if getter_start>=0:\n        getter_end=body.find(';',getter_start)\n        if getter_end<0 or getter_end-getter_start>500:\n            raise SystemExit('v319 responsive repair: Weather Center time getter terminator missing')\n        body=body[:getter_start]+new_time+body[getter_end+1:]\n    elif 'weather-center-radar-preloaded' not in body or \"frames[i].toUtc().toIso8601String()\" not in body:\n        raise SystemExit('v319 responsive repair: neither legacy Weather Center getter nor direct-ISO preloaded renderer is present')\n    else:\n        print('v319 Weather Center already uses direct ISO timestamps in the preloaded renderer; legacy getter not required')\n"""
          if old not in s:
              raise SystemExit('Weather Center getter failure block not found')
          s=s.replace(old,new,1)

          old_frames="""    if assign_start<0:\n        raise SystemExit('v319 responsive repair: Weather Center frame assignment missing')\n    # This assignment sits inside setState and ends before the next semicolon.\n    assign_end=body.find(';',assign_start)\n    if assign_end<0 or assign_end-assign_start>500:\n        raise SystemExit('v319 responsive repair: Weather Center frame assignment terminator missing')\n    assignment=body[assign_start:assign_end]\n    if 'next.sublist' not in assignment:\n        raise SystemExit('v319 responsive repair: Weather Center frame assignment shape unexpected')\n    body=body[:assign_start]+'noaaFramesV271=next.length>8?next.sublist(next.length-8):next'+body[assign_end:]\n"""
          new_frames="""    if assign_start>=0:\n        # This assignment sits inside setState and ends before the next semicolon.\n        assign_end=body.find(';',assign_start)\n        if assign_end<0 or assign_end-assign_start>500:\n            raise SystemExit('v319 responsive repair: Weather Center frame assignment terminator missing')\n        assignment=body[assign_start:assign_end]\n        if 'next.sublist' in assignment:\n            body=body[:assign_start]+'noaaFramesV271=next.length>8?next.sublist(next.length-8):next'+body[assign_end:]\n    elif 'weather-center-radar-preloaded' not in body:\n        raise SystemExit('v319 responsive repair: Weather Center frame source and preloaded renderer both missing')\n"""
          if old_frames not in s:
              raise SystemExit('Weather Center frame failure block not found')
          s=s.replace(old_frames,new_frames,1)

          old_required="""    \"timeParametersV271=><String,String>{'TIME':frame.toUtc().toIso8601String()}\",\n    'noaaFramesV271=next.length>8?next.sublist(next.length-8):next',\n"""
          new_required="""    'weather-center-radar-preloaded',\n    \"frames[i].toUtc().toIso8601String()\",\n"""
          if old_required not in s:
              raise SystemExit('v319 helper required-list block not found')
          s=s.replace(old_required,new_required,1)
          p.write_text(s)
          Path('.github/workflows/v319-weathercenter-contract-fix.yml').unlink()
      - run: |
          git config user.name 'BridgePoint Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Align v319 Weather Center repair with runtime contract'
          git push origin HEAD:mobile-v325-release-compat
