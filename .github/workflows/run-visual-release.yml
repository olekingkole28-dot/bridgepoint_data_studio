# Latest visual release trigger v1
name: Run Latest BridgePoint Visual Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-visual-release.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Build latest visual source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run visual-release-v2.yml --ref main
