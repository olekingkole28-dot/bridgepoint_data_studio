name: Hook BridgePoint v325 after v324 audit

on:
  push:
    branches: [mobile-v325-release-compat]
    paths:
      - '.github/workflows/v325-hook.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v325-release-compat
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path
          p=Path('tool/fix_bridgepoint_network_v323.py')
          s=p.read_text()
          anchor="runpy.run_path('tool/audit_owner_truth_catalog_v324.py',run_name='__main__')"
          hook=anchor+"\n    runpy.run_path('tool/apply_mobile_community_share_v325.py',run_name='__main__')"
          # The marker-already-applied branch is indented four spaces.
          if "    "+anchor in s and 'apply_mobile_community_share_v325.py' not in s:
              s=s.replace("    "+anchor,"    "+hook,1)
          # The normal fall-through path is unindented. Ensure it also reaches v325.
          normal="\n"+anchor
          normal_hook=normal+"\nrunpy.run_path('tool/apply_mobile_community_share_v325.py',run_name='__main__')"
          if normal in s and s.count('apply_mobile_community_share_v325.py')<2:
              s=s.replace(normal,normal_hook,1)
          if s.count('apply_mobile_community_share_v325.py')<2:
              raise SystemExit(f'Expected v325 hook in both v323 repair paths, found {s.count("apply_mobile_community_share_v325.py")}')
          p.write_text(s)
          Path('.github/workflows/v325-hook.yml').unlink()
      - run: |
          git config user.name 'BridgePoint Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Run v325 community and radar polish after v324 audit'
          git push origin HEAD:mobile-v325-release-compat
