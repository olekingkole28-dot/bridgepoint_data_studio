name: BridgePoint Customer Priority Source V1036 — Retired

# Fail-closed retirement marker.
# This workflow previously rewrote primary navigation to Plans-first, omitted Worth,
# and pushed generated source directly to main. That contract conflicts with the
# current customer-visible mobile recovery and must not be executed.
#
# Current release certification is coordinated against the exact current main head.
# Do not restore a mutating workflow here. Source changes must go through the guarded
# release path with Flutter analysis, tests, release build, artifact hashes, public
# verification, and user-visible Android confirmation.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse obsolete navigation rewrite
        shell: bash
        run: |
          echo "Retired: V1036 would reintroduce Plans-first navigation without Worth."
          echo "Use the current guarded mobile release certification task instead."
          exit 1
