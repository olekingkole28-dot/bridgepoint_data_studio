# trigger v1
name: Productize Owner AI V845

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/productize-owner-ai-v845.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace raw control-plane dump with operating cockpit
        shell: python
        run: |
          from pathlib import Path
          p=Path('lib/screens/bridgepoint_owner_ai_cockpit.dart')
          s=p.read_text()
          old="""                _card(
                  title: 'Live control-plane snapshot',
                  subtitle:
                      'This is raw owner-only status for debugging and verification. Customer surfaces remain plain-language and package-scoped.',
                  child: SelectableText(
                    _pretty(data),
                    style: const TextStyle(
                        color: _muted,
                        fontFamily: 'monospace',
                        fontSize: 12.5,
                        height: 1.45),
                  ),
                ),
"""
          new="""                _card(
                  title: 'Live AI operating status',
                  subtitle:
                      'Plain-language runtime, task and worker health. Internal payloads stay out of the normal owner workflow.',
                  child: _OwnerAiStatusSummary(data: data),
                ),
"""
          if old not in s:
              raise SystemExit('raw snapshot block not found')
          s=s.replace(old,new,1)
          marker='class BridgePointOwnerAiCockpit extends StatefulWidget'
          insert=r'''
class _OwnerAiStatusSummary extends StatelessWidget {
  const _OwnerAiStatusSummary({required this.data});
  final Map<String, dynamic> data;

  static const _cyan = Color(0xFF48E1FF);
  static const _green = Color(0xFF45E6A6);
  static const _amber = Color(0xFFFFC95E);
  static const _red = Color(0xFFFF6B6B);
  static const _muted = Color(0xFFB5C6D9);
  static const _soft = Color(0xFF16324E);

  Map<String, dynamic> _map(dynamic value) {
    if (value is Map<String, dynamic>) return value;
    if (value is Map) return Map<String, dynamic>.from(value);
    return const {};
  }

  List<Map<String, dynamic>> _rows(dynamic value) {
    if (value is! List) return const [];
    return value.whereType<Map>().map((e) => Map<String, dynamic>.from(e)).toList();
  }

  int _int(dynamic value) {
    if (value is num) return value.round();
    return int.tryParse('${value ?? ''}') ?? 0;
  }

  Widget _metric(String label, String value, Color color, IconData icon) => Container(
        width: 150,
        padding: const EdgeInsets.all(12),
        decoration: BoxDecoration(
          color: color.withValues(alpha: .09),
          borderRadius: BorderRadius.circular(13),
          border: Border.all(color: color.withValues(alpha: .18)),
        ),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Icon(icon, color: color, size: 20),
            const SizedBox(height: 8),
            Text(value, style: const TextStyle(fontSize: 21, fontWeight: FontWeight.w900)),
            const SizedBox(height: 2),
            Text(label, style: const TextStyle(color: _muted, fontSize: 11.5, fontWeight: FontWeight.w800)),
          ],
        ),
      );

  @override
  Widget build(BuildContext context) {
    final control = _map(data['control']);
    final runtime = _map(control['runtime']);
    final counts = _map(control['task_counts']);
    final provider = _map(control['provider']);
    final workers = _rows(control['workers']);
    final activeTasks = _rows(control['active_tasks']);
    final runtimeHealthy = runtime['edge_function_ready'] == true && runtime['last_error'] == null;
    final failed = _int(counts['failed']);
    final running = _int(counts['running']);
    final queued = _int(counts['queued']);
    final succeeded = _int(counts['succeeded']);

    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        Wrap(
          spacing: 9,
          runSpacing: 9,
          children: [
            _metric('Workers', '${workers.length}', _cyan, Icons.groups_2_rounded),
            _metric('Active tasks', '${activeTasks.length}', _green, Icons.bolt_rounded),
            _metric('Running', '$running', _green, Icons.play_circle_fill_rounded),
            _metric('Queued', '$queued', _amber, Icons.schedule_rounded),
            _metric('Succeeded', '$succeeded', _cyan, Icons.check_circle_rounded),
            _metric('Failed', '$failed', failed == 0 ? _green : _red, Icons.error_outline_rounded),
          ],
        ),
        const SizedBox(height: 12),
        Container(
          padding: const EdgeInsets.all(13),
          decoration: BoxDecoration(
            color: _soft.withValues(alpha: .62),
            borderRadius: BorderRadius.circular(13),
            border: Border.all(color: (runtimeHealthy ? _green : _amber).withValues(alpha: .18)),
          ),
          child: Row(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Icon(runtimeHealthy ? Icons.health_and_safety_rounded : Icons.warning_amber_rounded,
                  color: runtimeHealthy ? _green : _amber),
              const SizedBox(width: 10),
              Expanded(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(runtimeHealthy ? 'Runtime healthy' : 'Runtime needs attention',
                        style: const TextStyle(fontSize: 14, fontWeight: FontWeight.w900)),
                    const SizedBox(height: 4),
                    Text(
                      '${runtime['provider_name'] ?? 'BridgePoint local-first'} • edge function ${runtime['edge_function_ready'] == true ? 'ready' : 'not ready'} • hosted provider ${provider['enabled'] == true ? 'enabled' : 'disabled'}',
                      style: const TextStyle(color: _muted, fontSize: 12.5, height: 1.4),
                    ),
                    if (runtime['last_error'] != null) ...[
                      const SizedBox(height: 4),
                      Text('Latest issue: ${runtime['last_error']}', style: const TextStyle(color: _amber, fontSize: 12.5)),
                    ],
                  ],
                ),
              ),
            ],
          ),
        ),
        if (workers.isNotEmpty) ...[
          const SizedBox(height: 14),
          const Text('WORKER FLEET', style: TextStyle(color: _muted, fontSize: 11.5, fontWeight: FontWeight.w900, letterSpacing: .9)),
          const SizedBox(height: 7),
          ...workers.take(16).map((worker) {
            final status = '${worker['status'] ?? 'UNKNOWN'}'.toUpperCase();
            final statusColor = status == 'RUNNING'
                ? _green
                : status == 'FAILED'
                    ? _red
                    : status == 'IDLE'
                        ? _cyan
                        : _amber;
            return Container(
              margin: const EdgeInsets.only(bottom: 7),
              padding: const EdgeInsets.all(12),
              decoration: BoxDecoration(
                color: _soft.withValues(alpha: .46),
                borderRadius: BorderRadius.circular(12),
                border: Border.all(color: statusColor.withValues(alpha: .12)),
              ),
              child: Row(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Container(width: 9, height: 9, margin: const EdgeInsets.only(top: 5), decoration: BoxDecoration(color: statusColor, shape: BoxShape.circle)),
                  const SizedBox(width: 9),
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            Expanded(child: Text('${worker['display_name'] ?? worker['role'] ?? 'AI worker'}', style: const TextStyle(fontSize: 13.5, fontWeight: FontWeight.w900))),
                            Text(status, style: TextStyle(color: statusColor, fontSize: 10.5, fontWeight: FontWeight.w900)),
                          ],
                        ),
                        const SizedBox(height: 3),
                        Text('${worker['mission'] ?? 'BridgePoint autonomous operating lane'}', maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(color: _muted, fontSize: 11.5, height: 1.35)),
                      ],
                    ),
                  ),
                ],
              ),
            );
          }),
        ],
      ],
    );
  }
}

'''
          s=s.replace(marker,insert+marker,1)
          p.write_text(s)
      - name: Commit product cockpit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Product QA'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/screens/bridgepoint_owner_ai_cockpit.dart
          git commit -m 'Replace owner AI JSON dump with operating cockpit'
          git push origin HEAD:main
