name: BridgePoint Product Surface Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-surface-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tool/product_surface_audit.py
      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Product QA'
          git config user.email 'actions@users.noreply.github.com'
          git add product-surface-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh full product surface audit'
          git push origin HEAD:main
